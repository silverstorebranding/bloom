</style>
<script>
/* 💼 الحسابات → جدول accounts_entries في Supabase → #/accounts
   (لو حبيت تعمل قسم حسابات تاني منفصل: makeAccounts({...}) تاني بجدول تاني) */
function makeAccounts(CFG){
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 });
  const toNum = v => { const x = parseFloat(String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g, '')); return isNaN(x) ? null : x; };
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const today = () => ymd(new Date());
  const monthStart = () => { const t = new Date(); return ymd(new Date(t.getFullYear(), t.getMonth(), 1)); };
  const isAC = () => (location.hash.replace('#/', '') || 'home').split('/')[0] === CFG.route;
  const sb = () => window.AuthGate && window.AuthGate.sb;
  const me = () => (window.AuthGate && window.AuthGate.me && window.AuthGate.me()) || {};
  const myName = () => me().full_name || me().username || '';
  const dayLabel = k => new Date(k + 'T12:00:00').toLocaleDateString('ar-EG', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  // البنود الجاهزة — زوّد أو شيل من هنا (والموظف يقدر يكتب بند جديد بإيده)
  const CATS = {
    income:  ['مبيعات أونلاين', 'تحصيل شركة الشحن', 'مبيعات مباشرة', 'إيرادات أخرى'],
    expense: ['إعلانات', 'بضاعة وخامات', 'شحن', 'تغليف', 'مرتبات', 'عمولات', 'إيجار', 'كهربا ونت وموبايلات', 'مواصلات', 'مصاريف أخرى'],
  };
  const METHODS = ['كاش', 'فودافون كاش', 'إنستاباي', 'تحويل بنكي'];

  let S = { rows:null, loading:false, busy:false, err:'', msg:'', msgErr:false,
            date: today(), kind:'expense', category:'', item:'', amount:'', method:'كاش',
            ob:{}, tFrom:'كاش', tTo:'إنستاباي',
            from: monthStart(), to: today(), q:'', show:'all' };
  const TRANSFER_CAT = 'تحويل بين الحسابات';
  const isTrf = r => r.category === TRANSFER_CAT;

  /* ---------- البيانات ---------- */
  async function load(){
    if(!sb()) return;
    S.loading = true; S.err = ''; draw();
    const { data, error } = await sb().from(CFG.table).select('*')
      .order('entry_date', { ascending:false }).order('created_at', { ascending:false }).limit(10000);
    S.loading = false;
    if(error){
      S.err = /does not exist|relation|schema cache|Could not find/i.test(error.message)
        ? 'جدول ' + CFG.title + ' (' + CFG.table + ') لسه مش موجود في Supabase — لازم كود الـ SQL يتشغّل الأول.'
        : 'مقدرناش نجيب الحسابات: ' + error.message;
    } else S.rows = data || [];
    draw();
  }

  const inRange = r => (!S.from || r.entry_date >= S.from) && (!S.to || r.entry_date <= S.to);
  const filtered = () => {
    const q = S.q.trim().toLowerCase();
    return (S.rows || []).filter(r => inRange(r) &&
      (S.show === 'all' || (S.show === 'transfer' ? isTrf(r) : r.kind === S.show && !isTrf(r))) &&
      (!q || [r.category, r.item, r.method, r.created_by_name].some(v => String(v || '').toLowerCase().includes(q))));
  };
  function sums(list){
    const t = { i:0, e:0, ni:0, ne:0 };
    list.forEach(x => { if(isOpen(x) || isTrf(x)) return; if(x.kind === 'income'){ t.i += Number(x.amount); t.ni++; } else { t.e += Number(x.amount); t.ne++; } });
    t.net = t.i - t.e;
    return t;
  }
  /* ---------- 🏦 رصيد أول المدة / الترحيل ----------
     - "رصيد أول المدة" (kind = opening) = الفلوس اللي في إيدك في أول يوم التاريخ ده، قبل أي عملية فيه
     - الرصيد في أي يوم = آخر رصيد أول مدة متسجل قبله + (الإيرادات − المصروفات) من تاريخه لحد اليوم ده
     - رصيد آخر الشهر بيترحّل تلقائي ويبقى رصيد أول الشهر اللي بعده */
  const OPENING_CAT = 'رصيد أول المدة';
  const isOpen = r => r.kind === 'opening';
  const nextDay = k => ymd(new Date(new Date(k + 'T12:00:00').getTime() + 864e5));
  /* 👛 كل حساب (كاش / فودافون كاش / إنستاباي / بنك) ليه رصيده لوحده:
     رصيده = آخر رصيد أول مدة ليه + الداخل − الخارج بنفس طريقة الدفع من بعدها. والرصيد الكلي = مجموع الحسابات */
  const walletOf = r => r.method || 'غير محدد';
  function wallets(){
    const set = new Set(METHODS);
    (S.rows || []).forEach(r => set.add(walletOf(r)));
    return [...set];
  }
  function walletAt(w, X){ // رصيد الحساب w في بداية يوم X
    const rows = (S.rows || []).filter(r => walletOf(r) === w);
    let O = null;
    rows.forEach(r => { if(isOpen(r) && r.entry_date <= X && (!O || r.entry_date > O.entry_date || (r.entry_date === O.entry_date && r.created_at > O.created_at))) O = r; });
    let bal = O ? Number(O.amount) : 0;
    const from = O ? O.entry_date : '';
    rows.forEach(r => {
      if(isOpen(r) || r.entry_date >= X || r.entry_date < from) return;
      bal += r.kind === 'income' ? Number(r.amount) : -Number(r.amount);
    });
    return bal;
  }
  function walletFlow(w, a, b){ // الداخل والخارج للحساب w من يوم a لحد يوم b
    const t = { in:0, out:0 };
    (S.rows || []).forEach(r => {
      if(isOpen(r) || walletOf(r) !== w || (a && r.entry_date < a) || (b && r.entry_date > b)) return;
      if(r.kind === 'income') t.in += Number(r.amount); else t.out += Number(r.amount);
    });
    return t;
  }
  function balanceAt(X){ return wallets().reduce((s, w) => s + walletAt(w, X), 0); }
  const firstDate = () => (S.rows || []).reduce((m, r) => !m || r.entry_date < m ? r.entry_date : m, '');
  const hasOpening = () => (S.rows || []).some(isOpen);
  function periodBalances(){
    const f = S.from || firstDate() || today();
    const t = S.to || today();
    return { start: balanceAt(f), end: balanceAt(nextDay(t)), startDate: f, endDate: t };
  }
  function monthsSummary(){
    const fd = firstDate(); if(!fd) return [];
    const out = []; const now = new Date();
    let y = +fd.slice(0, 4), m = +fd.slice(5, 7) - 1;
    while(y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth())){
      const a = ymd(new Date(y, m, 1)), b = ymd(new Date(y, m + 1, 1));
      const t = sums((S.rows || []).filter(r => r.entry_date >= a && r.entry_date < b));
      out.push({ key: a.slice(0, 7), from: a, to: ymd(new Date(y, m + 1, 0)),
        label: new Date(y, m, 15).toLocaleDateString('ar-EG', { month:'long', year:'numeric' }),
        start: balanceAt(a), i: t.i, e: t.e, net: t.net, end: balanceAt(b) });
      m++; if(m > 11){ m = 0; y++; }
    }
    return out.reverse();
  }

  function byCat(list, kind){
    const m = {};
    list.filter(r => r.kind === kind && !isTrf(r)).forEach(r => { const k = r.category || 'بدون بند'; m[k] = (m[k] || 0) + Number(r.amount); });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }
  function flash(msg, isErr){ S.msg = msg; S.msgErr = !!isErr; draw(); }

  /* ---------- الرسم ---------- */
  function draw(){
    if(!isAC()) return;
    const main = document.getElementById('main'); if(!main) return;
    const f = document.activeElement, fid = f && f.id, pos = f && f.selectionStart;
    main.innerHTML = view();
    wire(main);
    if(fid){ const n = document.getElementById(fid); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} } }
  }

  function rangeTitle(){
    if(!S.from && !S.to) return 'كل الأيام';
    if(S.from && S.from === S.to) return dayLabel(S.from);
    return 'من ' + (S.from || 'البداية') + ' لـ ' + (S.to || 'النهارده');
  }

  function catBars(list, kind){
    const rows = byCat(list, kind);
    if(!rows.length) return '<p class="none">مفيش.</p>';
    const max = rows[0][1] || 1, col = kind === 'income' ? '#276749' : '#b3423a';
    return rows.map(([k, v]) => `<div class="ac-cat"><span class="nm">${esc(k)}</span>
      <span class="bar"><i style="width:${Math.max(2, v / max * 100)}%;background:${col}"></i></span>
      <span class="v">${fmt(v)} ج</span></div>`).join('');
  }

  function view(){
    const inc = S.kind === 'income', opn = S.kind === 'opening', trf = S.kind === 'transfer';
    let h = `<div class="pagehead"><h1>${CFG.icon} ${CFG.title}</h1><p>${CFG.desc}</p></div>`;
    if(S.msg) h += `<div class="ac-msg ${S.msgErr ? 'err' : ''}">${esc(S.msg)}</div>`;

    // ملخص النهارده دايمًا ظاهر
    if(S.rows){
      const T0 = sums(S.rows.filter(r => r.entry_date === today()));
      h += `<div class="card" style="padding:12px 16px"><b>📅 النهارده:</b>
        إيرادات <b style="color:#276749">${fmt(T0.i)} ج</b> ·
        مصروفات <b style="color:#b3423a">${fmt(T0.e)} ج</b> ·
        الصافي <b style="color:${T0.net < 0 ? '#b3423a' : 'var(--brass-d)'}">${fmt(T0.net)} ج</b> ·
        🏦 الرصيد دلوقتي <b style="color:#2b5a8a">${fmt(balanceAt(nextDay(today())))} ج</b>
        <span style="color:var(--muted)">(${METHODS.map(m => `${esc(m === 'تحويل بنكي' ? 'البنك' : m)} ${fmt(walletAt(m, nextDay(today())))}`).join(' · ')})</span></div>`;
    }

    h += `<div class="card">
      <h3>${trf ? '🔁 تحويل فلوس من حساب لحساب' : opn ? '🏦 تسجيل رصيد أول المدة' : inc ? '➕ تسجيل إيراد' : '➖ تسجيل مصروف'}</h3>
      <div class="ac-kind">
        <button type="button" class="exp ${S.kind === 'expense' ? 'on' : ''}" data-kind="expense">➖ مصروف</button>
        <button type="button" class="inc ${inc ? 'on' : ''}" data-kind="income">➕ إيراد</button>
        <button type="button" class="trf ${trf ? 'on' : ''}" data-kind="transfer">🔁 تحويل بين الحسابات</button>
        <button type="button" class="opn ${opn ? 'on' : ''}" data-kind="opening">🏦 رصيد أول المدة</button>
      </div>
      ${opn ? `<p class="ac-note">اكتب الفلوس اللي كانت موجودة فعلاً (في الخزنة + المحافظ + البنك) في <b>أول يوم</b> التاريخ ده قبل أي عملية فيه.
        بتسجّله <b>مرة واحدة بس</b> في البداية (مثلاً أول الشهر اللي بدأت تسجّل فيه)، وبعد كده السيستم بيرحّل رصيد آخر كل شهر للشهر اللي بعده لوحده.
        ولو عملت جرد وطلع الرصيد الحقيقي مختلف، سجّل رصيد أول مدة جديد بتاريخ الجرد وهو هيبدأ يحسب منه.
        اكتب رصيد كل حساب لوحده، واللي مش عايز تغيّره سيبه فاضي.</p>
      <div class="ac-form" style="grid-template-columns:180px 1fr"><div><label for="acDate">رصيد يوم</label><input class="ac-in" id="acDate" type="date" value="${esc(S.date)}"></div>
        <div><label for="acItem">ملاحظة</label><input class="ac-in" id="acItem" placeholder="مثلاً: مرحّل من شهر سبتمبر" value="${esc(S.item)}" autocomplete="off"></div></div>
      <div class="ac-wal" style="margin-top:12px">${METHODS.map((m, i) => `<div><label for="acOb${i}">${esc(m)}</label><input class="ac-in" id="acOb${i}" data-ob="${esc(m)}" type="number" step="any" inputmode="decimal" placeholder="—" value="${esc(S.ob[m] ?? '')}"></div>`).join('')}</div>
      <button class="ac-btn pri" data-act="add" ${S.busy ? 'disabled' : ''}>${S.busy ? '⏳...' : 'سجّل الأرصدة'}</button>` : trf ? `
      <p class="ac-note">لما تنقل فلوس من حساب لحساب (مثلاً سحبت كاش من إنستاباي)، سجّلها هنا. التحويل بيغيّر رصيد الحسابين بس، ومش بيتحسب إيراد ولا مصروف.</p>
      <div class="ac-form" style="grid-template-columns:150px 1fr 1fr 130px 1fr auto">
        <div><label for="acDate">التاريخ</label><input class="ac-in" id="acDate" type="date" value="${esc(S.date)}"></div>
        <div><label for="acTFrom">من</label><select class="ac-in" id="acTFrom">${METHODS.map(m => `<option ${S.tFrom === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>
        <div><label for="acTTo">إلى</label><select class="ac-in" id="acTTo">${METHODS.map(m => `<option ${S.tTo === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>
        <div><label for="acAmount">المبلغ</label><input class="ac-in" id="acAmount" type="number" min="0" step="any" inputmode="decimal" placeholder="0" value="${esc(S.amount)}"></div>
        <div><label for="acItem">ملاحظة</label><input class="ac-in" id="acItem" placeholder="اختياري" value="${esc(S.item)}" autocomplete="off"></div>
        <div><button class="ac-btn pri" data-act="add" ${S.busy ? 'disabled' : ''}>${S.busy ? '⏳...' : 'سجّل التحويل'}</button></div>
      </div>` : `
      <div class="ac-form">
        <div><label for="acDate">${opn ? 'رصيد يوم' : 'التاريخ'}</label><input class="ac-in" id="acDate" type="date" value="${esc(S.date)}"></div>
        ${opn ? `<div><label>البند</label><input class="ac-in" value="${OPENING_CAT}" disabled></div>` : `<div><label for="acCat">البند</label><input class="ac-in" id="acCat" list="acCatList" placeholder="اختار أو اكتب" value="${esc(S.category)}" autocomplete="off">
          <datalist id="acCatList">${(CATS[S.kind] || []).map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>`}
        <div><label for="acItem">البيان</label><input class="ac-in" id="acItem" placeholder="${opn ? 'مثلاً: مرحّل من شهر سبتمبر' : inc ? 'مثلاً: تحصيل QP أسبوع 1' : 'مثلاً: إعلانات فيسبوك بيدج كارا'}" value="${esc(S.item)}" autocomplete="off"></div>
        <div><label for="acAmount">${opn ? 'الرصيد' : 'المبلغ'}</label><input class="ac-in" id="acAmount" type="number" ${opn ? '' : 'min="0"'} step="any" inputmode="decimal" placeholder="0" value="${esc(S.amount)}"></div>
        <div><label for="acMethod">${opn ? 'فين الفلوس' : 'طريقة الدفع'}</label><select class="ac-in" id="acMethod">${(opn ? ['الإجمالي (كله)', ...METHODS] : METHODS).map(m => `<option ${S.method === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>
        <div><button class="ac-btn pri" data-act="add" ${S.busy ? 'disabled' : ''}>${S.busy ? '⏳...' : inc ? 'سجّل الإيراد' : 'سجّل المصروف'}</button></div>
      </div>`}
    </div>`;

    h += `<div class="card"><div class="ac-bar">
      <label>من <input class="ac-in" type="date" id="acFrom" value="${esc(S.from)}"></label>
      <label>إلى <input class="ac-in" type="date" id="acTo" value="${esc(S.to)}"></label>
      <button class="ac-btn" data-range="today">النهارده</button>
      <button class="ac-btn" data-range="yesterday">امبارح</button>
      <button class="ac-btn" data-range="month">الشهر ده</button>
      <button class="ac-btn" data-range="last">الشهر اللي فات</button>
      <button class="ac-btn" data-range="all">الكل</button>
      <span style="flex:1"></span>
      ${window.XLSX ? '<button class="ac-btn" data-act="xlsx">⬇️ Excel</button>' : ''}
      <button class="ac-btn" data-act="reload">🔄 تحديث</button>
    </div>
    <div class="ac-bar" style="margin-bottom:8px">
      <button class="ac-btn ${S.show === 'all' ? 'on' : ''}" data-show="all">الكل</button>
      <button class="ac-btn ${S.show === 'income' ? 'on' : ''}" data-show="income">الإيرادات بس</button>
      <button class="ac-btn ${S.show === 'expense' ? 'on' : ''}" data-show="expense">المصروفات بس</button>
      <button class="ac-btn ${S.show === 'transfer' ? 'on' : ''}" data-show="transfer">🔁 التحويلات</button>
      <button class="ac-btn ${S.show === 'opening' ? 'on' : ''}" data-show="opening">🏦 أرصدة أول المدة</button>
    </div>
    <input class="ac-in" id="acQ" type="search" placeholder="🔍 دوّر بالبند أو البيان أو اسم اللي سجّل..." value="${esc(S.q)}"></div>`;

    if(S.err) return h + `<div class="ac-msg err">${esc(S.err)}</div>`;
    if(S.rows === null) return h + `<div class="card"><p class="none">⏳ بيحمّل الحسابات...</p></div>`;

    const list = filtered();
    const T = sums(list);
    const PB = periodBalances();
    if(!hasOpening()) h += `<div class="ac-msg err">🏦 لسه مفيش "رصيد أول المدة" متسجل، فالسيستم بيحسب الرصيد كأنك بدأت من صفر. دوس "🏦 رصيد أول المدة" فوق وسجّل الفلوس اللي كانت معاك في أول يوم بدأت تسجّل فيه.</div>`;
    h += `<div class="ac-kpis">
      <div class="ac-kpi bal ${PB.start < 0 ? 'neg' : ''}"><div class="n">${fmt(PB.start)} ج</div><div class="l">🏦 رصيد أول المدة (مرحّل لحد ${esc(PB.startDate)})</div></div>
      <div class="ac-kpi inc"><div class="n">${fmt(T.i)} ج</div><div class="l">الإيرادات (${fmt(T.ni)} عملية) — ${esc(rangeTitle())}</div></div>
      <div class="ac-kpi exp"><div class="n">${fmt(T.e)} ج</div><div class="l">المصروفات (${fmt(T.ne)} عملية)</div></div>
      <div class="ac-kpi net ${T.net < 0 ? 'neg' : ''}"><div class="n">${fmt(T.net)} ج</div><div class="l">${T.net < 0 ? '🔻 عجز' : '✅ الصافي'} (إيرادات − مصروفات)</div></div>
      <div class="ac-kpi bal ${PB.end < 0 ? 'neg' : ''}"><div class="n">${fmt(PB.end)} ج</div><div class="l">🏦 رصيد آخر المدة (في آخر ${esc(PB.endDate)}) — بيترحّل للي بعده</div></div>
    </div>`;
    const MS = monthsSummary();
    if(MS.length) h += `<div class="card"><h3>📆 الترحيل شهر بشهر</h3>
      <p class="ac-note">رصيد آخر كل شهر بيترحّل تلقائي ويبقى رصيد أول الشهر اللي بعده. دوس على أي شهر عشان تعرضه.</p>
      <div class="tablewrap"><table class="pr"><tr><th>الشهر</th><th>رصيد أول الشهر (مرحّل)</th><th>الإيرادات</th><th>المصروفات</th><th>صافي الشهر</th><th>رصيد آخر الشهر</th></tr>
      ${MS.map(x => `<tr class="ac-day" data-month="${x.from}|${x.to}"><td class="lbl">${esc(x.label)}</td>
        <td class="ac-bal">${fmt(x.start)}</td><td class="ac-pos">${fmt(x.i)}</td><td class="ac-neg">${fmt(x.e)}</td>
        <td class="${x.net < 0 ? 'ac-neg' : 'ac-pos'}">${fmt(x.net)}</td><td class="ac-bal">${fmt(x.end)}</td></tr>`).join('')}
      </table></div></div>`;

    if(!list.length) return h + `<div class="card"><p class="none">مفيش عمليات ${S.from || S.to ? 'في الفترة دي' : 'متسجلة لسه'}.</p></div>`;

    h += `<div class="card"><h3>📊 حسب البند — ${esc(rangeTitle())}</h3><div class="ac-cats">
      <div><h4 style="margin:0 0 6px;color:#276749">الإيرادات</h4>${catBars(list, 'income')}</div>
      <div><h4 style="margin:0 0 6px;color:#b3423a">المصروفات</h4>${catBars(list, 'expense')}</div>
    </div></div>`;

    const days = {};
    list.forEach(r => (days[r.entry_date] = days[r.entry_date] || []).push(r));
    const keys = Object.keys(days).sort().reverse();
    const admin = !!me().is_admin, myId = me().id;

    let tb = '<tr><th>النوع</th><th>البند</th><th>البيان</th><th>المبلغ</th><th>طريقة الدفع</th><th>بواسطة</th><th></th></tr>';
    tb += `<tr class="total"><td class="lbl" colspan="3">إجمالي ${esc(rangeTitle())} — ${fmt(keys.length)} يوم</td><td class="${T.net < 0 ? 'ac-neg' : ''}">${fmt(T.net)} ج</td><td colspan="3">إيرادات ${fmt(T.i)} − مصروفات ${fmt(T.e)}</td></tr>`;
    keys.forEach(k => {
      const d = sums(days[k]);
      tb += `<tr class="ac-day" data-day="${k}" title="دوس تعرض اليوم ده بس"><td class="lbl" colspan="3">📅 ${esc(dayLabel(k))}</td>
        <td class="${d.net < 0 ? 'ac-neg' : 'ac-pos'}">صافي اليوم: ${fmt(d.net)} ج</td>
        <td colspan="2">إيرادات ${fmt(d.i)} − مصروفات ${fmt(d.e)}</td><td class="ac-bal">🏦 ${fmt(balanceAt(nextDay(k)))}</td></tr>`;
      days[k].forEach(r => {
        const isInc = r.kind === 'income';
        if(isOpen(r)){
          const canDel = admin || (r.created_by && r.created_by === myId);
          tb += `<tr><td><span class="ac-tag opn">🏦 رصيد أول المدة</span></td><td>${esc(r.category || OPENING_CAT)}</td>
            <td class="lbl" style="font-weight:400">${esc(r.item || '—')}</td><td class="ac-bal">${fmt(r.amount)}</td>
            <td>${esc(r.method || '—')}</td><td>${esc(r.created_by_name || '—')}</td>
            <td>${canDel ? `<button class="ac-btn sm" data-del="${r.id}" title="امسح">🗑️</button>` : ''}</td></tr>`;
          return;
        }
        if(isTrf(r)){
          const canDel = admin || (r.created_by && r.created_by === myId);
          tb += `<tr><td><span class="ac-tag trf">🔁 ${isInc ? 'دخل' : 'خرج'}</span></td><td>${esc(r.category)}</td>
            <td class="lbl" style="font-weight:400">${esc(r.item || '—')}</td><td class="${isInc ? 'ac-pos' : 'ac-neg'}">${isInc ? '' : '−'}${fmt(r.amount)}</td>
            <td>${esc(r.method || '—')}</td><td>${esc(r.created_by_name || '—')}</td>
            <td>${canDel ? `<button class="ac-btn sm" data-del="${r.id}" title="امسح التحويل">🗑️</button>` : ''}</td></tr>`;
          return;
        }
        const canDel = admin || (r.created_by && r.created_by === myId);
        tb += `<tr><td><span class="ac-tag ${isInc ? 'inc' : 'exp'}">${isInc ? '➕ إيراد' : '➖ مصروف'}</span></td>
          <td>${esc(r.category || '—')}</td>
          <td class="lbl" style="font-weight:400">${esc(r.item || '—')}</td>
          <td class="${isInc ? 'ac-pos' : 'ac-neg'}">${isInc ? '' : '−'}${fmt(r.amount)}</td>
          <td>${esc(r.method || '—')}</td>
          <td>${esc(r.created_by_name || '—')}</td>
          <td>${canDel ? `<button class="ac-btn sm" data-del="${r.id}" title="امسح">🗑️</button>` : ''}</td></tr>`;
      });
    });
    h += `<div class="card"><h3>كل العمليات يوم بيوم</h3>
      <div class="tablewrap" style="max-height:640px;overflow-y:auto"><table class="pr">${tb}</table></div>
      <p class="none" style="margin-top:8px">🏦 الرقم الأزرق في سطر كل يوم = الرصيد في آخر اليوم ده. دوس على أي يوم عشان تعرضه لوحده. لو سجّلت حاجة غلط امسحها وسجّلها تاني (المسح لصاحب العملية أو الأدمن).</p></div>`;
    h += walletsTable(PB);
    return h;
  }

  function walletsTable(PB){
    const a = PB.startDate, b = PB.endDate;
    const ws = wallets().filter(w => METHODS.includes(w) || walletAt(w, nextDay(b)) || walletAt(w, a) || walletFlow(w, a, b).in || walletFlow(w, a, b).out);
    const T = { s:0, in:0, out:0, e:0, now:0 };
    const rows = ws.map(w => {
      const st = walletAt(w, a), fl = walletFlow(w, a, b), en = walletAt(w, nextDay(b)), now = walletAt(w, nextDay(today()));
      T.s += st; T.in += fl.in; T.out += fl.out; T.e += en; T.now += now;
      const ico = w === 'كاش' ? '💵' : w === 'فودافون كاش' ? '📱' : w === 'إنستاباي' ? '⚡' : w === 'تحويل بنكي' ? '🏦' : '❔';
      return `<tr><td class="lbl">${ico} ${esc(w === 'تحويل بنكي' ? 'البنك' : w)}</td>
        <td class="ac-bal">${fmt(st)}</td><td class="ac-pos">${fmt(fl.in)}</td><td class="ac-neg">${fmt(fl.out)}</td>
        <td class="${en < 0 ? 'ac-neg' : 'ac-bal'}">${fmt(en)}</td><td class="${now < 0 ? 'ac-neg' : 'ac-bal'}"><b>${fmt(now)}</b></td></tr>`;
    }).join('');
    return `<div class="card"><h3>👛 رصيد كل حساب</h3>
      <p class="ac-note">كل عملية بتتحسب على الحساب اللي اخترته في "طريقة الدفع". الأعمدة من أول المدة لآخرها حسب الفترة اللي مختارها (${esc(rangeTitle())})، وآخر عمود هو الرصيد الحالي النهارده.</p>
      <div class="tablewrap"><table class="pr"><tr><th>الحساب</th><th>رصيد أول المدة</th><th>داخل</th><th>خارج</th><th>رصيد آخر المدة</th><th>الرصيد دلوقتي</th></tr>
      ${rows}
      <tr class="ac-wtot"><td class="lbl">الإجمالي</td><td class="ac-bal">${fmt(T.s)}</td><td class="ac-pos">${fmt(T.in)}</td><td class="ac-neg">${fmt(T.out)}</td><td class="ac-bal">${fmt(T.e)}</td><td class="ac-bal">${fmt(T.now)}</td></tr>
      </table></div>
      ${ws.includes('الإجمالي (كله)') ? '<p class="ac-note" style="margin-top:8px">⚠️ "الإجمالي (كله)" ده رصيد أول مدة اتسجّل قبل كده من غير ما يتوزّع على الحسابات. امسحه وسجّل رصيد كل حساب لوحده من زرار 🏦 رصيد أول المدة.</p>' : ''}
    </div>`;
  }

  /* ---------- الأحداث ---------- */
  function setRange(k){
    const t = new Date(), y = t.getFullYear(), m = t.getMonth();
    if(k === 'all'){ S.from = S.to = ''; return; }
    if(k === 'today'){ S.from = S.to = ymd(t); return; }
    if(k === 'yesterday'){ S.from = S.to = ymd(new Date(t.getTime() - 864e5)); return; }
    if(k === 'month'){ S.from = ymd(new Date(y, m, 1)); S.to = ymd(t); return; }
    if(k === 'last'){ S.from = ymd(new Date(y, m - 1, 1)); S.to = ymd(new Date(y, m, 0)); }
  }

  function wire(root){
    const $ = id => root.querySelector('#' + id);
    root.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => {
      if(S.kind !== b.dataset.kind) S.category = '';
      if(b.dataset.kind === 'opening' && S.kind !== 'opening'){ S.date = monthStart(); S.ob = {}; }
      else if(b.dataset.kind !== 'opening' && S.kind === 'opening'){ S.date = today(); }
      S.method = 'كاش';
      S.kind = b.dataset.kind; S.msg = ''; draw();
      const i = document.getElementById('acCat'); if(i) i.focus();
    });
    const d = $('acDate'); if(d) d.onchange = () => { S.date = d.value; };
    const ct = $('acCat'); if(ct) ct.oninput = () => { S.category = ct.value; };
    const it = $('acItem'); if(it){ it.oninput = () => { S.item = it.value; }; it.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); const a = document.getElementById('acAmount'); if(a) a.focus(); } }; }
    const am = $('acAmount'); if(am){ am.oninput = () => { S.amount = am.value; }; am.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); add(); } }; }
    const mt = $('acMethod'); if(mt) mt.onchange = () => { S.method = mt.value; };
    root.querySelectorAll('[data-ob]').forEach(i => i.oninput = () => { S.ob[i.dataset.ob] = i.value; });
    const tf = $('acTFrom'); if(tf) tf.onchange = () => { S.tFrom = tf.value; };
    const tt = $('acTTo'); if(tt) tt.onchange = () => { S.tTo = tt.value; };
    const ad = root.querySelector('[data-act=add]'); if(ad) ad.onclick = add;
    const fr = $('acFrom'); if(fr) fr.onchange = () => { S.from = fr.value; draw(); };
    const to = $('acTo'); if(to) to.onchange = () => { S.to = to.value; draw(); };
    root.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { setRange(b.dataset.range); draw(); });
    root.querySelectorAll('[data-show]').forEach(b => b.onclick = () => { S.show = b.dataset.show; draw(); });
    const q = $('acQ'); if(q) q.oninput = () => { S.q = q.value; draw(); };
    root.querySelectorAll('[data-month]').forEach(tr => tr.onclick = () => { const [a, b] = tr.dataset.month.split('|'); S.from = a; S.to = b > today() ? today() : b; draw(); window.scrollTo({ top:0, behavior:'smooth' }); });
    root.querySelectorAll('[data-day]').forEach(tr => tr.onclick = () => { S.from = S.to = tr.dataset.day; draw(); window.scrollTo({ top:0, behavior:'smooth' }); });
    root.querySelectorAll('[data-del]').forEach(b => b.onclick = e => { e.stopPropagation(); del(b.dataset.del); });
    const rl = root.querySelector('[data-act=reload]'); if(rl) rl.onclick = () => { S.msg = ''; load(); };
    const x = root.querySelector('[data-act=xlsx]'); if(x) x.onclick = exportXlsx;
  }

  async function add(){
    const opn = S.kind === 'opening';
    if(opn) return addOpening();
    if(S.kind === 'transfer') return addTransfer();
    const category = opn ? OPENING_CAT : S.category.trim(), item = S.item.trim(), amount = toNum(S.amount);
    if(!S.date) return flash('اختار التاريخ.', true);
    if(!category) return flash('اختار البند أو اكتبه.', true);
    if(opn){
      if(amount === null) return flash('اكتب الرصيد (ممكن يبقى صفر، أو بالسالب لو عليك فلوس).', true);
      const same = (S.rows || []).find(r => isOpen(r) && r.entry_date === S.date);
      if(same && !confirm(`فيه رصيد أول مدة متسجل بالفعل يوم ${S.date} (${fmt(same.amount)} ج). السيستم هيعتمد على الجديد. تكمل؟`)) return;
    } else if(amount === null || amount <= 0) return flash('اكتب المبلغ (رقم أكبر من صفر).', true);
    S.busy = true; draw();
    const { error } = await sb().from(CFG.table).insert({
      entry_date: S.date, kind: S.kind, category, item, amount, method: S.method, created_by_name: myName()
    });
    S.busy = false;
    if(error) return flash('❌ مقدرناش نسجّل: ' + error.message, true);
    const wasInc = S.kind === 'income';
    if(opn){
      S.item = ''; S.amount = ''; S.kind = 'expense'; S.method = 'كاش';
      S.msg = `✅ اتسجّل رصيد أول المدة ${fmt(amount)} ج يوم ${dayLabel(S.date)}. أي حساب بعد التاريخ ده هيبدأ منه.`; S.msgErr = false;
      S.date = today();
      await load(); return;
    }
    if((S.from && S.date < S.from) || (S.to && S.date > S.to)){ S.from = S.to = ''; }
    S.item = ''; S.amount = '';
    S.msg = `✅ اتسجّل ${wasInc ? 'إيراد' : 'مصروف'} "${category}${item ? ' — ' + item : ''}" بـ ${fmt(amount)} ج يوم ${dayLabel(S.date)}.`; S.msgErr = false;
    await load();
    const i = document.getElementById('acItem'); if(i) i.focus();
  }

  async function addOpening(){
    if(!S.date) return flash('اختار التاريخ.', true);
    const list = METHODS.map(m => ({ m, v: String(S.ob[m] ?? '').trim() })).filter(x => x.v !== '');
    if(!list.length) return flash('اكتب رصيد حساب واحد على الأقل (ممكن صفر).', true);
    for(const x of list){ x.n = toNum(x.v); if(x.n === null) return flash(`رصيد ${x.m} مش رقم صحيح.`, true); }
    const dup = list.filter(x => (S.rows || []).some(r => isOpen(r) && r.entry_date === S.date && walletOf(r) === x.m)).map(x => x.m);
    if(dup.length && !confirm(`فيه رصيد أول مدة متسجل بالفعل يوم ${S.date} لـ: ${dup.join('، ')}. السيستم هيعتمد على الجديد. تكمل؟`)) return;
    S.busy = true; draw();
    const item = S.item.trim();
    const { error } = await sb().from(CFG.table).insert(list.map(x => ({
      entry_date: S.date, kind: 'opening', category: OPENING_CAT, item, amount: x.n, method: x.m, created_by_name: myName() })));
    S.busy = false;
    if(error) return flash('❌ مقدرناش نسجّل: ' + error.message, true);
    S.msg = `✅ اتسجّل رصيد أول المدة يوم ${dayLabel(S.date)}: ` + list.map(x => `${x.m} ${fmt(x.n)} ج`).join(' · '); S.msgErr = false;
    S.ob = {}; S.item = ''; S.kind = 'expense'; S.date = today();
    await load();
  }

  async function addTransfer(){
    const amount = toNum(S.amount), note = S.item.trim();
    if(!S.date) return flash('اختار التاريخ.', true);
    if(S.tFrom === S.tTo) return flash('اختار حسابين مختلفين.', true);
    if(amount === null || amount <= 0) return flash('اكتب المبلغ (رقم أكبر من صفر).', true);
    S.busy = true; draw();
    const item = `من ${S.tFrom} إلى ${S.tTo}` + (note ? ' — ' + note : '');
    const base = { entry_date: S.date, category: TRANSFER_CAT, item, amount, created_by_name: myName() };
    const { error } = await sb().from(CFG.table).insert([
      { ...base, kind: 'expense', method: S.tFrom }, { ...base, kind: 'income', method: S.tTo } ]);
    S.busy = false;
    if(error) return flash('❌ مقدرناش نسجّل: ' + error.message, true);
    if((S.from && S.date < S.from) || (S.to && S.date > S.to)){ S.from = S.to = ''; }
    S.msg = `✅ اتسجّل تحويل ${fmt(amount)} ج ${item}.`; S.msgErr = false;
    S.amount = ''; S.item = '';
    await load();
  }

  async function del(id){
    const r = (S.rows || []).find(x => String(x.id) === String(id));
    if(!r || !confirm(`تمسح ${isTrf(r) ? 'التحويل (السطرين)' : isOpen(r) ? 'رصيد أول المدة' : r.kind === 'income' ? 'الإيراد' : 'المصروف'} "${r.category}${r.item ? ' — ' + r.item : ''}" (${fmt(r.amount)} ج)؟`)) return;
    let ids = [id];
    if(isTrf(r)){ // التحويل متسجّل سطرين (خارج من حساب + داخل لحساب) — بيتمسحوا مع بعض
      const twin = (S.rows || []).find(x => x.id !== r.id && isTrf(x) && x.created_at === r.created_at && x.item === r.item && Number(x.amount) === Number(r.amount));
      if(twin) ids.push(twin.id);
    }
    const { data, error } = await sb().from(CFG.table).delete().in('id', ids).select('id');
    if(error || !data || !data.length) return flash('❌ مقدرناش نمسح' + (error ? ': ' + error.message : ' — المسح لصاحب العملية أو الأدمن بس.'), true);
    S.msg = '✅ اتمسحت.'; S.msgErr = false;
    await load();
  }

  function exportXlsx(){
    const list = filtered().slice().sort((a, b) => a.entry_date < b.entry_date ? -1 : a.entry_date > b.entry_date ? 1 : 0);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(list.map(r => ({
      'التاريخ': r.entry_date, 'النوع': isOpen(r) ? 'رصيد أول المدة' : isTrf(r) ? (r.kind === 'income' ? 'تحويل داخل' : 'تحويل خارج') : r.kind === 'income' ? 'إيراد' : 'مصروف', 'البند': r.category || '', 'البيان': r.item || '',
      'المبلغ': r.kind === 'expense' ? -Number(r.amount) : Number(r.amount), 'طريقة الدفع': r.method || '', 'بواسطة': r.created_by_name || '' }))), 'كل العمليات');
    const days = {};
    list.forEach(r => (days[r.entry_date] = days[r.entry_date] || []).push(r));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.keys(days).sort().map(k => { const t = sums(days[k]);
      return { 'التاريخ': k, 'رصيد أول اليوم': balanceAt(k), 'الإيرادات': t.i, 'المصروفات': t.e, 'الصافي': t.net, 'رصيد آخر اليوم': balanceAt(nextDay(k)) }; })), 'صافي كل يوم');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(monthsSummary().reverse().map(x => ({
      'الشهر': x.key, 'رصيد أول الشهر (مرحّل)': x.start, 'الإيرادات': x.i, 'المصروفات': x.e, 'صافي الشهر': x.net, 'رصيد آخر الشهر': x.end }))), 'الترحيل الشهري');
    const cats = [...byCat(list, 'income').map(([k, v]) => ({ 'النوع':'إيراد', 'البند':k, 'الإجمالي':v })),
                  ...byCat(list, 'expense').map(([k, v]) => ({ 'النوع':'مصروف', 'البند':k, 'الإجمالي':v }))];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cats), 'حسب البند');
    { const PB = periodBalances();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(wallets().map(w => { const fl = walletFlow(w, PB.startDate, PB.endDate);
        return { 'الحساب': w, 'رصيد أول المدة': walletAt(w, PB.startDate), 'داخل': fl.in, 'خارج': fl.out, 'رصيد آخر المدة': walletAt(w, nextDay(PB.endDate)), 'الرصيد دلوقتي': walletAt(w, nextDay(today())) }; })), 'رصيد كل حساب'); }
    XLSX.writeFile(wb, CFG.title + ' ' + (S.from || 'الكل') + (S.to && S.to !== S.from ? ' إلى ' + S.to : '') + '.xlsx');
  }

  /* ---------- لينك في القائمة (تحت المالية) ---------- */
  const anchor = document.querySelector(CFG.anchor);
  if(anchor && !document.querySelector(`#sidebar a.navlink[href="#/${CFG.route}"]`)){
    const a = document.createElement('a');
    a.className = 'navlink'; a.href = '#/' + CFG.route; a.textContent = CFG.icon + ' ' + CFG.title;
    if(CFG.before) anchor.before(a); else anchor.after(a);
  }

  /* ---------- الربط بالراوتر ---------- */
  function mount(){
    document.querySelectorAll('#sidebar a.navlink').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#/' + CFG.route));
    draw(); if(S.rows === null && !S.loading && !S.err) load();
  }
  const _render = render;
  render = function(){ _render.apply(this, arguments); if(isAC()) mount(); };
  window.addEventListener('hashchange', () => { if(isAC()) mount(); });
  if(isAC()) setTimeout(mount, 0);
}

// 💼 حساباتنا
makeAccounts({ route:'accounts', table:'accounts_entries', icon:'💼', title:'الحسابات',
  desc:'سجّل الإيرادات والمصروفات بتاريخها، والسيستم بيحسب صافي كل يوم (إيرادات − مصروفات) وإجمالي أي فترة.',
  anchor:'#sidebar a.navlink[href="#/accounts"]', before:false });

</script>

     📤 رفع الأوردرات من Google Sheet على QP — بلوك مستقل (انسخه كله مرة واحدة)
     مكانه: جوه <body> في المكان اللي عايز القسم يظهر فيه. مش محتاج أي مكتبة ولا أي حاجة تانية.

<style>
#qpu-root{--qpu-ink:#1f2933;--qpu-mut:#6b7280;--qpu-line:#e3e6ea;--qpu-bg:#fff;--qpu-soft:#f5f7f9;--qpu-pri:#1f3d36;--qpu-ok:#2f7d55;--qpu-bad:#b3261e;--qpu-warn:#b7791f;
  font-family:'Cairo','Readex Pro',Tahoma,Arial,sans-serif;direction:rtl;color:var(--qpu-ink);max-width:1200px;margin:0 auto;font-size:14.5px}
#qpu-root *{box-sizing:border-box}
#qpu-root h2{margin:0 0 4px;font-size:22px}#qpu-root h3{margin:0 0 10px;font-size:16px}
#qpu-root .qpu-card{background:var(--qpu-bg);border:1px solid var(--qpu-line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
#qpu-root .qpu-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#qpu-root .qpu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
#qpu-root label{display:block;font-size:12.5px;color:var(--qpu-mut);margin-bottom:4px}
#qpu-root input,#qpu-root select{width:100%;padding:9px 11px;border:1.5px solid var(--qpu-line);border-radius:9px;font-family:inherit;font-size:14px;background:#fff;color:var(--qpu-ink)}
#qpu-root .qpu-btn{padding:9px 16px;border:1.5px solid var(--qpu-line);border-radius:10px;background:#fff;color:var(--qpu-ink);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
#qpu-root .qpu-btn.pri{background:var(--qpu-pri);border-color:var(--qpu-pri);color:#fff}
#qpu-root .qpu-btn.ok{background:var(--qpu-ok);border-color:var(--qpu-ok);color:#fff}
#qpu-root .qpu-btn:disabled{opacity:.5;cursor:not-allowed}
#qpu-root .qpu-msg{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:14px}
#qpu-root .qpu-msg.ok{background:#e3f3e8;color:#23784a}#qpu-root .qpu-msg.err{background:#fdecea;color:#a3271a}#qpu-root .qpu-msg.info{background:#eef5fc;color:#2c5282}
#qpu-root .qpu-acct{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:#e3f3e8;color:#1b4332;font-weight:700}
#qpu-root .qpu-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
#qpu-root .qpu-kpi{border:1px solid var(--qpu-line);border-radius:10px;padding:8px 12px;background:var(--qpu-soft)}#qpu-root .qpu-kpi b{display:block;font-size:20px}#qpu-root .qpu-kpi span{font-size:12px;color:var(--qpu-mut)}
#qpu-root .qpu-tw{overflow:auto;max-height:60vh;border:1px solid var(--qpu-line);border-radius:10px}
#qpu-root table{width:100%;border-collapse:collapse;font-size:13px}
#qpu-root th{position:sticky;top:0;background:var(--qpu-pri);color:#fff;padding:7px 8px;text-align:right;font-weight:600;white-space:nowrap;z-index:1}
#qpu-root td{padding:5px 8px;border-bottom:1px solid var(--qpu-line);vertical-align:top}
#qpu-root td[contenteditable]{outline:none;min-width:60px}#qpu-root td[contenteditable]:focus{background:#fffbe6;box-shadow:inset 0 0 0 2px #e0a020}
#qpu-root tr.bad td{background:#fff6f5}#qpu-root tr.done td{background:#eef8f1}
#qpu-root .qpu-tag{display:inline-block;padding:1px 8px;border-radius:8px;font-size:11.5px;font-weight:700;margin:1px}
#qpu-root .qpu-tag.bad{background:#fdecea;color:#a3271a}#qpu-root .qpu-tag.ok{background:#e3f3e8;color:#23784a}#qpu-root .qpu-tag.w{background:#fff3cd;color:#8a5a00}
#qpu-root .qpu-x{border:none;background:none;cursor:pointer;color:var(--qpu-mut);font-size:15px}
#qpu-root details summary{cursor:pointer;font-weight:700}
#qpu-root .qpu-tabs{display:flex;gap:6px;margin:10px 0}#qpu-root .qpu-tabs button{padding:7px 14px;border:1.5px solid var(--qpu-line);border-radius:20px;background:#fff;font-family:inherit;font-weight:700;cursor:pointer}
#qpu-root .qpu-tabs button.on{background:var(--qpu-pri);color:#fff;border-color:var(--qpu-pri)}
</style>
<script>
/* ============================================================================================
   📤 QP Uploader — بيجيب الأوردرات من شيت Google Sheets ويجهّزها ويرفعها على أكونت QP
   - الإعدادات (رابط الشيت + بيانات QP) بتتحفظ في المتصفح بتاع الجهاز ده بس (localStorage)
   - الأوردر اللي بيترفع بيتسجل إنه اتاخد، فمش بيرجع تاني لما تجيب من الشيت
   - API بتاع QP: POST /integration/token  ·  GET /integration/cities  ·  POST /integration/order
   ============================================================================================ */
(function(){
  const ROOT = document.getElementById('qpu-root'); if(!ROOT) return;
  const QPI = 'https://api.qpxpress.com/integration/';
  const LS = { cfg:'qpu_cfg', creds:'qpu_creds', done:'qpu_done', hist:'qpu_hist', map:'qpu_map' };
  const ld = (k, d) => { try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } };
  const sv = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const digits = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const numOf = s => { const t = digits(s).replace(/[,\s]/g, '').replace(/ج|جنيه|egp|le/gi, ''); return t !== '' && !isNaN(t) ? Number(t) : null; };
  const phoneOf = s => { let t = digits(s).replace(/\D/g, ''); if(t.startsWith('20') && t.length === 12) t = t.slice(2); if(t.startsWith('0')) t = t.slice(1); return t; };
  const isPhone = s => /^1[0125]\d{8}$/.test(phoneOf(s));
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const tzIso = () => { const d = new Date(), o = -d.getTimezoneOffset(), p = n => String(Math.floor(Math.abs(n))).padStart(2, '0');
    return ymd(d) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + (o >= 0 ? '+' : '-') + p(o / 60) + ':' + p(o % 60); };
  const normAr = s => String(s || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[ًٌٍَُِّْـ]/g, '').toLowerCase().trim();

  const S = { cfg:ld(LS.cfg, { sheet:'', tab:'', notes:'', acctLabel:'' }), creds:ld(LS.creds, null), tok:null, acct:null, cities:null,
    rows:null, msg:'', msgT:'', busy:false, prog:'', tab:'ready', done:new Set(ld(LS.done, [])), hist:ld(LS.hist, []), headers:null, map:ld(LS.map, {}) };

  /* ---------- 🔐 QP ---------- */
  function jwtClaims(t){ try{ const p = t.split('.')[1]; return JSON.parse(decodeURIComponent(escape(atob(p.replace(/-/g, '+').replace(/_/g, '/'))))); }catch(e){ return {}; } }
  async function qpToken(force){
    if(S.tok && !force) return S.tok;
    const c = S.creds; if(!c || !c.u) throw new Error('اكتب يوزر وباسورد QP الأول.');
    const r = await fetch(QPI + 'token', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ username:c.u, password:c.p }) });
    const j = await r.json().catch(() => ({}));
    if(!r.ok || !(j.token || j.access)) throw new Error('QP رفض اليوزر والباسورد دول — اتأكد إنهم بيانات الـ Integration الصح.');
    S.tok = j.token || j.access;
    // 👤 اسم الأكونت: من رد QP أو من التوكن، وإلا اليوزر نيم
    const cl = jwtClaims(S.tok), pick = o => o && (o.name || o.full_name || o.company || o.company_name || o.store_name || o.username || o.user_name);
    S.acct = { name: pick(j) || pick(j.user) || pick(cl) || c.u, user:c.u, id: cl.user_id || cl.id || (j.user && j.user.id) || '' };
    return S.tok;
  }
  async function qpCall(path, opt, retry){
    const t = await qpToken();
    const r = await fetch(QPI + path, { ...(opt || {}), headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + t } });
    if(r.status === 401 && !retry){ S.tok = null; return qpCall(path, opt, true); }
    const txt = await r.text(); let j = null; try{ j = JSON.parse(txt); }catch(e){}
    if(!r.ok){ const m = j ? (j.detail || j.message || j.error || Object.entries(j).map(([k, v]) => k + ': ' + (Array.isArray(v) ? v.join('، ') : (typeof v === 'object' ? JSON.stringify(v) : v))).join(' | ')) : txt.slice(0, 200); throw new Error(m || 'HTTP ' + r.status); }
    return j;
  }
  async function connect(){
    S.busy = true; msg('بيتصل بـ QP...', 'info');
    try{ await qpToken(true); const j = await qpCall('cities');
      S.cities = (Array.isArray(j) ? j : (j && (j.results || j.data)) || []).map(c => ({ id:c.id, name:String(c.name || c.city || '').trim() })).filter(c => c.name);
      msg(`✅ متصل بأكونت QP: ${acctName()} (${S.cities.length} مدينة)`, 'ok'); if(S.rows) S.rows.forEach(check); }
    catch(e){ S.tok = null; S.acct = null; msg(/Failed to fetch|NetworkError/i.test(e.message) ? 'مش قادر يوصل لـ QP — اتأكد من الإنترنت.' : e.message, 'err'); }
    S.busy = false; draw();
  }
  const acctName = () => S.cfg.acctLabel ? `${S.cfg.acctLabel} (${S.acct ? S.acct.user : (S.creds || {}).u})` : (S.acct ? S.acct.name + (S.acct.name !== S.acct.user ? ` (${S.acct.user})` : '') : ((S.creds || {}).u || '—'));
  function guessCity(text){
    if(!S.cities) return '';
    const words = normAr(text).split(/[\s,،\-\/]+/).filter(Boolean).map(w => w.replace(/^ال/, '')), t = ' ' + words.join(' ') + ' ';
    let best = ''; S.cities.forEach(c => { const n = normAr(c.name).split(/\s+/).map(w => w.replace(/^ال/, '')).join(' '); if(n && t.includes(' ' + n + ' ') && n.length > normAr(best).length) best = c.name; });
    return best;
  }

  /* ---------- 📄 Google Sheet ---------- */
  function sheetUrl(){
    const v = String(S.cfg.sheet || '').trim(); if(!v) return null;
    if(/output=csv|tqx=out:csv/.test(v)) return v;                                   // رابط CSV جاهز
    const m = v.match(/\/d\/([a-zA-Z0-9-_]+)/) || v.match(/^([a-zA-Z0-9-_]{25,})$/); if(!m) return null;
    const gid = (v.match(/[#&?]gid=(\d+)/) || [])[1];
    return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv` + (S.cfg.tab ? '&sheet=' + encodeURIComponent(S.cfg.tab) : gid ? '&gid=' + gid : '');
  }
  function parseCSV(t){
    const rows = []; let row = [], cur = '', q = false;
    for(let i = 0; i < t.length; i++){ const c = t[i];
      if(q){ if(c === '"'){ if(t[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
      else if(c === '"') q = true; else if(c === ','){ row.push(cur); cur = ''; } else if(c === '\n' || c === '\r'){ if(c === '\r' && t[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += c; }
    if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(x => String(x).trim()));
  }
  // الأعمدة: بيتعرف عليها لوحده من العناوين، وتقدر تغيّرها من "🧩 الأعمدة"
  const FIELDS = [ ['name', 'الاسم', /^(name|full ?name|customer|الاسم|اسم العميل|العميل)/i], ['phone', 'الموبايل', /(phone|mobile|موبايل|تليفون|رقم|هاتف)/i],
    ['phone2', 'موبايل تاني (اختياري)', /(phone ?2|second|تاني|اخر|آخر)/i], ['address', 'العنوان', /(address|عنوان)/i], ['city', 'المحافظة / المدينة (اختياري)', /(city|gov|محافظ|مدينه|مدينة)/i],
    ['amount', 'السعر (المطلوب تحصيله)', /(total|price|amount|سعر|اجمالي|إجمالي|المبلغ|تحصيل)/i], ['contents', 'الطلب / المحتوى', /(content|product|item|order|الطلب|المنتج|المحتوي|الاوردر)/i],
    ['notes', 'notes (اختياري)', /(note|ملاحظ|براند|brand)/i], ['id', 'رقم الأوردر في الشيت (اختياري)', /^(id|order ?id|#|رقم الاوردر|رقم الطلب|كود)$/i] ];
  function autoMap(H){
    const m = {}, used = new Set();
    FIELDS.forEach(([k, , re]) => { const i = H.findIndex((h, ix) => !used.has(ix) && re.test(String(h).trim())); if(i >= 0){ m[k] = i; used.add(i); } });
    return m;
  }
  const rowKey = r => r.id ? 'id:' + r.id : 'k:' + phoneOf(r.phone) + '|' + normAr(r.contents).slice(0, 40) + '|' + (numOf(r.amount) || 0);
  function check(r){
    r.errs = [];
    if(!String(r.name).trim()) r.errs.push('الاسم فاضي');
    if(!isPhone(r.phone)) r.errs.push('الموبايل غلط');
    if(String(r.address).trim().length < 5) r.errs.push('العنوان ناقص');
    if(numOf(r.amount) === null) r.errs.push('السعر مش رقم');
    if(!String(r.contents).trim()) r.errs.push('الطلب فاضي');
    if(!String(r.city || '').trim()){ r.city = guessCity((r.cityRaw || '') + ' ' + r.address); }
    if(S.cities && !r.city) r.errs.push('المدينة مش واضحة');
    return r;
  }
  function dupCheck(){ const c = {}; (S.rows || []).forEach(r => { const k = phoneOf(r.phone); if(k) c[k] = (c[k] || 0) + 1; }); (S.rows || []).forEach(r => r.dup = c[phoneOf(r.phone)] > 1); }
  async function fetchSheet(){
    const url = sheetUrl(); if(!url) return msg('حط رابط الشيت الأول (رابط Google Sheet العادي أو رابط CSV منشور).', 'err');
    S.busy = true; msg('بيجيب الأوردرات من الشيت...', 'info');
    try{
      const r = await fetch(url, { cache:'no-store' }); const t = await r.text();
      if(!r.ok || /<html/i.test(t.slice(0, 200))) throw new Error('مش قادر يقرا الشيت — لازم يكون متشارك "Anyone with the link can view" (أو منشور CSV).');
      const A = parseCSV(t); if(A.length < 2) throw new Error('الشيت فاضي.');
      const H = A[0].map(x => String(x).trim()); S.headers = H;
      const sig = H.join('|'); if(!S.map[sig]){ S.map[sig] = autoMap(H); sv(LS.map, S.map); }
      const M = S.map[sig], g = (row, k) => M[k] !== undefined && M[k] !== '' ? String(row[M[k]] ?? '').trim() : '';
      const all = A.slice(1).map((row, i) => ({ line:i + 2, id:g(row, 'id'), name:g(row, 'name'), phone:g(row, 'phone'), phone2:g(row, 'phone2'), address:g(row, 'address'), cityRaw:g(row, 'city'), city:'',
        amount:g(row, 'amount'), contents:g(row, 'contents'), notes:g(row, 'notes') })).filter(r => r.name || r.phone || r.contents);
      if(S.cities) all.forEach(r => { const c = guessCity(r.cityRaw); if(c) r.city = c; });
      const fresh = all.filter(r => !S.done.has(rowKey(r)));
      S.rows = fresh.map(check); dupCheck(); S.tab = 'ready';
      msg(`📥 الشيت فيه ${all.length} أوردر — ${fresh.length} لسه ماترفعوش${all.length - fresh.length ? ` (و ${all.length - fresh.length} اترفعوا قبل كده ومش هيظهروا)` : ''}.`, 'ok');
    }catch(e){ msg(/Failed to fetch/i.test(e.message) ? 'مش قادر يوصل للشيت — اتأكد إنه متشارك "Anyone with the link can view".' : e.message, 'err'); }
    S.busy = false; draw();
  }

  /* ---------- 🚀 الرفع ---------- */
  const ready = () => (S.rows || []).filter(r => !r.serial && !r.errs.length);
  const noteOf = r => String(r.notes || S.cfg.notes || '').trim();
  async function upload(){
    const L = ready(); if(!L.length) return;
    if(!S.tok){ await connect(); if(!S.tok) return; }
    const total = L.reduce((a, r) => a + (numOf(r.amount) || 0), 0);
    if(!confirm(`⚠️ هيترفع على أكونت QP:\n\n👤 ${acctName()}\n\n• ${L.length} أوردر\n• إجمالي ${total.toLocaleString('ar-EG')} ج\n\nده الأكونت الصح؟ موافق ترفع؟`)) return;
    S.busy = true; let ok = 0, fail = 0;
    for(let i = 0; i < L.length; i++){
      const r = L[i]; S.prog = `بيرفع ${i + 1} من ${L.length}...`; draw();
      try{
        const body = { full_name:r.name.trim(), phone:'0' + phoneOf(r.phone), address:r.address.trim(), total_amount:numOf(r.amount), notes:noteOf(r), order_date:tzIso(),
          shipment_contents:r.contents.trim(), weight:'1.00', city:String(r.city || '').trim() };
        if(r.phone2 && isPhone(r.phone2)) body.phone2 = '0' + phoneOf(r.phone2);
        let res;
        try{ res = await qpCall('order', { method:'POST', body:JSON.stringify(body) }); }
        catch(e1){ if(body.city || !/city|مدين/i.test(e1.message)) throw e1; const b2 = { ...body }; delete b2.city; res = await qpCall('order', { method:'POST', body:JSON.stringify(b2) }); }
        r.serial = String((res && (res.serial || res.order_serial || (res.data && res.data.serial) || res.id)) || '✔'); r.upErr = ''; ok++;
        S.done.add(rowKey(r));
      }catch(e){ r.upErr = e.message; fail++; }
    }
    sv(LS.done, [...S.done].slice(-20000));
    const up = L.filter(r => r.serial);
    if(up.length){ S.hist.unshift({ at:new Date().toISOString(), acct:acctName(), n:up.length, total:up.reduce((a, r) => a + (numOf(r.amount) || 0), 0), orders:up.map(r => ({ serial:r.serial, name:r.name, phone:r.phone, amount:r.amount, line:r.line })) }); S.hist = S.hist.slice(0, 50); sv(LS.hist, S.hist); }
    S.busy = false; S.prog = '';
    msg(`✅ اترفع ${ok} أوردر على ${acctName()}${fail ? ` — ❌ ${fail} مارفعوش (السبب مكتوب جنب كل واحد)` : ''}.`, fail ? 'err' : 'ok'); S.tab = fail ? 'bad' : 'done'; draw();
  }
  function csvDownload(name, rows){
    const s = rows.map(r => r.map(v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + s], { type:'text/csv;charset=utf-8' })); a.download = name; a.click();
  }

  /* ---------- 🖥️ الشاشة ---------- */
  function msg(t, k){ S.msg = t; S.msgT = k || 'info'; draw(); }
  function view(){
    const c = S.cfg, cr = S.creds || {};
    let h = `<div class="qpu-card"><h2>📤 رفع الأوردرات على QP</h2><p style="margin:0;color:var(--qpu-mut)">بيجيب الأوردرات من شيت Google ويجهّزها ويرفعها على أكونت QP — اللي بيترفع مش بيرجع تاني.</p></div>`;
    if(S.msg) h += `<div class="qpu-msg ${S.msgT}">${esc(S.msg)}</div>`;
    // 1) QP
    h += `<div class="qpu-card"><h3>1️⃣ أكونت QP</h3>${S.tok ? `<div class="qpu-row"><span class="qpu-acct">👤 متصل بـ: ${esc(acctName())}</span><button class="qpu-btn" data-a="logout">🔄 غيّر الأكونت</button></div>`
      : `<div class="qpu-grid"><div><label>يوزر نيم QP (Integration)</label><input id="qpuU" value="${esc(cr.u || '')}" autocomplete="off" style="direction:ltr"></div><div><label>الباسورد</label><input id="qpuP" type="password" value="${esc(cr.p || '')}" autocomplete="new-password" style="direction:ltr"></div>
        <div><label>اسم الأكونت (يظهرلك قبل الرفع — اختياري)</label><input id="qpuL" value="${esc(c.acctLabel || '')}" placeholder="مثلاً: براند X"></div></div>
        <div class="qpu-row" style="margin-top:10px"><button class="qpu-btn pri" data-a="login" ${S.busy ? 'disabled' : ''}>🔐 ادخل على QP</button><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="qpuRem" style="width:auto" ${cr.u ? 'checked' : ''}> افتكرني على الجهاز ده</label></div>`}</div>`;
    // 2) الشيت
    h += `<div class="qpu-card"><h3>2️⃣ الشيت</h3><div class="qpu-grid"><div style="grid-column:1/-1"><label>رابط Google Sheet (لازم يكون "Anyone with the link can view") أو رابط CSV منشور</label><input id="qpuS" value="${esc(c.sheet)}" placeholder="https://docs.google.com/spreadsheets/d/..../edit#gid=0" style="direction:ltr"></div>
      <div><label>اسم التاب (اختياري)</label><input id="qpuT" value="${esc(c.tab)}" placeholder="Sheet1"></div><div><label>notes الافتراضية (لو الشيت مافيهوش notes)</label><input id="qpuN" value="${esc(c.notes)}" placeholder="مثلاً: brand x"></div></div>
      <div class="qpu-row" style="margin-top:10px"><button class="qpu-btn pri" data-a="fetch" ${S.busy ? 'disabled' : ''}>${S.busy && !S.prog ? '⏳ بيجيب...' : '📥 هات كل الأوردرات'}</button>${S.headers ? '<button class="qpu-btn" data-a="map">🧩 الأعمدة</button>' : ''}</div>
      ${S.showMap && S.headers ? mapHtml() : ''}</div>`;
    // 3) الأوردرات
    if(S.rows){
      const R = S.rows, rd = ready(), bad = R.filter(r => !r.serial && r.errs.length), dn = R.filter(r => r.serial), tot = rd.reduce((a, r) => a + (numOf(r.amount) || 0), 0);
      h += `<div class="qpu-card"><h3>3️⃣ الأوردرات</h3><div class="qpu-kpis"><div class="qpu-kpi"><b>${R.length}</b><span>جات من الشيت</span></div><div class="qpu-kpi"><b style="color:var(--qpu-ok)">${rd.length}</b><span>✅ جاهزة للرفع</span></div>
        <div class="qpu-kpi"><b style="color:var(--qpu-bad)">${bad.length}</b><span>⚠️ فيها مشاكل</span></div><div class="qpu-kpi"><b>${tot.toLocaleString('ar-EG')}</b><span>إجمالي الجاهزين (ج)</span></div><div class="qpu-kpi"><b>${dn.length}</b><span>📦 اترفعت دلوقتي</span></div></div>
        <div class="qpu-row"><button class="qpu-btn ok" data-a="upload" ${!rd.length || S.busy ? 'disabled' : ''}>${S.prog ? '⏳ ' + esc(S.prog) : `🚀 ارفع الـ ${rd.length} الجاهزين على QP`}</button>${S.tok ? `<span style="font-size:13px;color:var(--qpu-mut)">على أكونت: <b>${esc(acctName())}</b></span>` : '<span style="font-size:13px;color:var(--qpu-warn)">⚠️ ادخل على QP الأول (فوق)</span>'}
          ${dn.length ? '<button class="qpu-btn" data-a="csv">⬇️ نزّل اللي اترفع (CSV)</button>' : ''}</div>
        <div class="qpu-tabs">${[['ready', `✅ جاهزة (${rd.length})`], ['bad', `⚠️ فيها مشاكل (${bad.length})`], ['done', `📦 اترفعت (${dn.length})`]].map(([k, l]) => `<button class="${S.tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
        ${tableHtml(S.tab === 'ready' ? rd : S.tab === 'bad' ? bad : dn)}
        <p style="font-size:12.5px;color:var(--qpu-mut);margin:8px 0 0">💡 تقدر تعدّل أي خانة في الجدول بالضغط عليها، والتعديل بيتشيك على طول. ✕ بيشيل الأوردر ومايرجعش تاني.</p></div>`;
    }
    // سجل الرفع
    if(S.hist.length) h += `<div class="qpu-card"><details><summary>🕒 سجل الرفع (${S.hist.length})</summary><div class="qpu-tw" style="margin-top:8px"><table><tr><th>إمتى</th><th>الأكونت</th><th>عدد</th><th>إجمالي</th><th></th></tr>
      ${S.hist.map((x, i) => `<tr><td>${esc(new Date(x.at).toLocaleString('ar-EG'))}</td><td>${esc(x.acct || '')}</td><td>${x.n}</td><td>${Number(x.total || 0).toLocaleString('ar-EG')}</td><td><button class="qpu-btn" data-hcsv="${i}" style="padding:4px 10px">⬇️ CSV</button></td></tr>`).join('')}</table></div></details></div>`;
    return h;
  }
  function mapHtml(){
    const sig = S.headers.join('|'), M = S.map[sig] || {};
    return `<div style="margin-top:12px;padding:12px;border:1px dashed var(--qpu-line);border-radius:10px"><b>🧩 كل خانة جاية من أنهي عمود في الشيت:</b><div class="qpu-grid" style="margin-top:8px">
      ${FIELDS.map(([k, l]) => `<div><label>${l}</label><select data-map="${k}"><option value="">— مش موجود —</option>${S.headers.map((hd, i) => `<option value="${i}" ${String(M[k]) === String(i) ? 'selected' : ''}>${esc(hd || 'عمود ' + (i + 1))}</option>`).join('')}</select></div>`).join('')}</div>
      <p style="font-size:12.5px;color:var(--qpu-mut);margin:8px 0 0">بعد ما تغيّر دوس "📥 هات كل الأوردرات" تاني.</p></div>`;
  }
  function tableHtml(L){
    if(!L.length) return '<p style="color:var(--qpu-mut)">مفيش.</p>';
    const ed = (r, k) => `<td contenteditable="${r.serial ? 'false' : 'true'}" data-ed="${S.rows.indexOf(r)}" data-k="${k}" ${k === 'phone' ? 'style="direction:ltr"' : ''}>${esc(r[k])}</td>`;
    return `<div class="qpu-tw"><table><tr><th>سطر</th><th>الاسم</th><th>الموبايل</th><th>العنوان</th><th>المدينة</th><th>السعر</th><th>الطلب</th><th>notes</th><th>الحالة</th><th></th></tr>
      ${L.map(r => `<tr class="${r.serial ? 'done' : r.errs.length || r.upErr ? 'bad' : ''}"><td>${r.line}</td>${ed(r, 'name')}${ed(r, 'phone')}${ed(r, 'address')}
        <td>${r.serial ? esc(r.city) : `<select data-city="${S.rows.indexOf(r)}" style="min-width:120px;padding:4px"><option value="">—</option>${(S.cities || []).map(c => `<option ${c.name === r.city ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}${r.city && !(S.cities || []).some(c => c.name === r.city) ? `<option selected>${esc(r.city)}</option>` : ''}</select>`}</td>
        ${ed(r, 'amount')}${ed(r, 'contents')}<td>${esc(noteOf(r))}</td>
        <td>${r.serial ? `<span class="qpu-tag ok">✅ ${esc(r.serial)}</span>` : ''}${r.errs.map(e => `<span class="qpu-tag bad">${esc(e)}</span>`).join('')}${r.dup && !r.serial ? '<span class="qpu-tag w">رقم متكرر</span>' : ''}${r.upErr ? `<span class="qpu-tag bad">❌ ${esc(r.upErr)}</span>` : ''}</td>
        <td>${r.serial ? '' : `<button class="qpu-x" data-rm="${S.rows.indexOf(r)}" title="شيله ومايرجعش تاني">✕</button>`}</td></tr>`).join('')}</table></div>`;
  }
  function draw(){
    const keep = {}; ['qpuU', 'qpuP', 'qpuL', 'qpuS', 'qpuT', 'qpuN'].forEach(id => { const e = document.getElementById(id); if(e) keep[id] = e.value; });
    ROOT.innerHTML = view();
    Object.entries(keep).forEach(([id, v]) => { const e = document.getElementById(id); if(e) e.value = v; });
    const $ = id => document.getElementById(id), saveCfg = () => { S.cfg = { ...S.cfg, sheet:($('qpuS') || {}).value ?? S.cfg.sheet, tab:($('qpuT') || {}).value ?? S.cfg.tab, notes:($('qpuN') || {}).value ?? S.cfg.notes, acctLabel:($('qpuL') || {}).value ?? S.cfg.acctLabel }; sv(LS.cfg, S.cfg); };
    ['qpuS', 'qpuT', 'qpuN', 'qpuL'].forEach(id => { const e = $(id); if(e) e.onchange = () => { saveCfg(); if(id === 'qpuN' && S.rows) draw(); }; });
    ROOT.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      const a = b.dataset.a; saveCfg();
      if(a === 'login'){ const u = $('qpuU').value.trim(), p = $('qpuP').value; if(!u || !p) return msg('اكتب اليوزر والباسورد.', 'err'); S.creds = { u, p }; if($('qpuRem').checked) sv(LS.creds, S.creds); else localStorage.removeItem(LS.creds); S.tok = null; await connect(); }
      if(a === 'logout'){ S.tok = null; S.acct = null; S.creds = null; localStorage.removeItem(LS.creds); msg('اكتب بيانات الأكونت الجديد.', 'info'); }
      if(a === 'fetch') fetchSheet();
      if(a === 'map'){ S.showMap = !S.showMap; draw(); }
      if(a === 'upload') upload();
      if(a === 'csv'){ const L = S.rows.filter(r => r.serial); csvDownload(`QP ${ymd(new Date())} (${L.length}).csv`, [['رقم الشحنة', 'سطر في الشيت', 'الاسم', 'الموبايل', 'العنوان', 'المدينة', 'السعر', 'الطلب', 'notes'], ...L.map(r => [r.serial, r.line, r.name, '0' + phoneOf(r.phone), r.address, r.city, r.amount, r.contents, noteOf(r)])]); }
    });
    ROOT.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; draw(); });
    ROOT.querySelectorAll('[data-map]').forEach(s => s.onchange = () => { const sig = S.headers.join('|'); S.map[sig] = { ...(S.map[sig] || {}), [s.dataset.map]:s.value === '' ? '' : Number(s.value) }; sv(LS.map, S.map); });
    ROOT.querySelectorAll('[data-ed]').forEach(td => td.onblur = () => { const r = S.rows[+td.dataset.ed]; if(!r) return; const v = td.textContent.trim(); if(v === String(r[td.dataset.k])) return; r[td.dataset.k] = v; if(td.dataset.k === 'address') r.city = ''; check(r); dupCheck(); draw(); });
    ROOT.querySelectorAll('[data-city]').forEach(s => s.onchange = () => { const r = S.rows[+s.dataset.city]; r.city = s.value; check(r); draw(); });
    ROOT.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const r = S.rows[+b.dataset.rm]; if(!r || !confirm(`تشيل أوردر "${r.name}"؟ مش هيرجع تاني.`)) return; S.done.add(rowKey(r)); sv(LS.done, [...S.done]); S.rows.splice(+b.dataset.rm, 1); dupCheck(); draw(); });
    ROOT.querySelectorAll('[data-hcsv]').forEach(b => b.onclick = () => { const x = S.hist[+b.dataset.hcsv]; csvDownload(`QP ${x.at.slice(0, 10)} (${x.n}).csv`, [['رقم الشحنة', 'سطر', 'الاسم', 'الموبايل', 'السعر'], ...x.orders.map(o => [o.serial, o.line, o.name, o.phone, o.amount])]); });
  }
  draw();
  if(S.creds && S.creds.u) connect();
})();
</script>
<!-- ===================== نهاية بلوك رفع الأوردرات ===================== -->
</body>
