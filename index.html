<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>نظام المخزن والحسابات</title>

<style>
:root{
  --ink:#1c2321; --paper:#f6f4ef; --line:#dcd6c9; --panel:#ffffff;
  --brass:#8a6d3b; --brass-d:#5f4b28; --slate:#3f5a56; --slate-l:#e7eeec;
  --warn:#9a3b2e; --ok:#3d6b4f; --muted:#6b6659;
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3,h4{font-weight:600;margin:0 0 .5em}
a{color:inherit}

::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

#app{display:flex;min-height:100vh}
/* Sidebar on the right for RTL */
#sidebar{
  width:250px;flex:none;background:var(--brass-d);color:#f3ede0;
  padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
#sidebar .brand{font-size:19px;font-weight:700;margin-bottom:4px}

#sidebar a.navlink{
  display:block;padding:7px 10px;border-radius:6px;color:#f3ede0;text-decoration:none;
  font-size:14px;margin-bottom:2px;opacity:.88
}
#sidebar a.navlink:hover{background:rgba(255,255,255,.08)}
#sidebar a.navlink.active{background:#f3ede0;color:var(--brass-d);opacity:1;font-weight:600}

#userbox select{width:100%;margin-top:6px;padding:5px;border-radius:5px;border:none}

#main{flex:1;min-width:0;padding:26px 34px;max-width:980px}
.crumb{color:var(--muted);font-size:13px;margin-bottom:10px}
.pagehead{margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:14px}
.pagehead h1{font-size:26px}
.pagehead p{color:var(--muted);margin:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card h3{font-size:15px;color:var(--brass-d);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.flowmap{display:flex;flex-wrap:wrap;gap:0;align-items:center;justify-content:center;margin:20px 0}
.flownode{background:var(--panel);border:1.5px solid var(--brass);border-radius:9px;padding:12px 16px;font-size:14px;cursor:pointer;min-width:130px;text-align:center;transition:.15s}
.flownode:hover{background:var(--slate-l);border-color:var(--slate)}
.flowarrow{color:var(--brass);font-size:20px;padding:0 8px}

.orgtier{margin-bottom:22px}
.orgtier .lbl{font-size:12px;color:var(--muted);margin-bottom:8px}
.orgrow{display:flex;flex-wrap:wrap;gap:12px}
.orgcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 16px;cursor:pointer;min-width:150px}

.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;margin-inline-end:6px}
.b-slate{background:var(--slate-l);color:var(--slate)}
.b-warn{background:#f4e2de;color:var(--warn)}
.b-ok{background:#e1ece4;color:var(--ok)}

ul.plain{margin:0;padding-inline-start:18px}

.do-dont{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.do-dont .col{border-radius:9px;padding:14px}

table.sum th.g-rs{background:#a0456e}

input.adsIn{width:75px;padding:4px;border:1px solid var(--brass);border-radius:5px;background:#dcfce7;color:#1c2321;text-align:center}

}

.home-cards a.card{text-decoration:none;display:block;transition:border-color .15s}
.home-cards a.card:hover{border-color:var(--brass)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* =====================================================================
   ⚙️ الإعدادات — غيّر دول بس ببيانات مشروع Supabase الجديد
   (Supabase → Project Settings → API / Data API)
   ===================================================================== */
const APP_CONFIG = {
  SUPABASE_URL: 'https://dnvoeaznipfmbxqjrukg.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_yplH2DRpvF-92B8feOeJ3w_8JQRB0By',
  EMAIL_DOMAIN: 'agents-app.com', // اليوزرنيم بيتحوّل لإيميل وهمي: username@agents-app.com
  APP_NAME: 'نظام المخزن والحسابات'
};

/* ✅ عميل Supabase واحد للصفحة كلها — ولو التوكن خلص بيجدّده ويعيد الطلب مرة */
window.__sbClient = (function(){
  if(!(window.supabase && window.supabase.createClient)) return null;
  if(/YOUR-PROJECT-REF|PASTE-YOUR/.test(APP_CONFIG.SUPABASE_URL + APP_CONFIG.SUPABASE_ANON_KEY)){
    document.addEventListener('DOMContentLoaded', () => alert('⚠️ لازم تحط SUPABASE_URL و SUPABASE_ANON_KEY بتوع مشروعك في بلوك الإعدادات (APP_CONFIG) جوه الملف.'));
  }
  let client = null;
  const isExpired = async r => {
    if(r.status !== 401) return false;
    try{ return /jwt expired|invalid jwt|jwt/i.test(await r.clone().text()); }catch(e){ return false; }
  };
  const smartFetch = async (input, init) => {
    let res = await fetch(input, init);
    const url = typeof input === 'string' ? input : ((input && input.url) || '');
    if(client && !url.includes('/auth/v1/') && await isExpired(res)){
      const { data, error } = await client.auth.refreshSession();
      if(!error && data && data.session){
        const headers = new Headers((init && init.headers) || {});
        headers.set('Authorization', 'Bearer ' + data.session.access_token);
        res = await fetch(input, { ...(init || {}), headers });
      } else {
        window.dispatchEvent(new Event('sb-session-dead'));
      }
    }
    return res;
  };
  client = window.supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY, {
    auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:false },
    global: { fetch: smartFetch }
  });
  document.addEventListener('visibilitychange', () => { if(!document.hidden) client.auth.getSession(); });
  return client;
})();

/* ---------------- الراوتر ---------------- */
function render(){
  const main = document.getElementById('main');
  const hash = location.hash.replace('#/', '') || 'home';
  const [route, param] = hash.split('/');
  document.querySelectorAll('#sidebar a.navlink').forEach(a => {
    const h = a.getAttribute('href');
    a.classList.toggle('active', h === '#/' + route || h === '#/' + route + '/' + (param || ''));
  });
  // المخزن (#/dept/warehouse) والحسابات (#/accounts) بيرسموا نفسهم من البلوكات بتاعتهم تحت
  if((route === 'dept' && param === 'warehouse') || route === 'accounts'){ main.innerHTML = ''; return; }
  main.innerHTML = `<div class="pagehead"><h1>🏬 ${APP_CONFIG.APP_NAME}</h1><p>اختار القسم اللي هتشتغل عليه.</p></div>
    <div class="home-cards">
      <a class="card" href="#/dept/warehouse"><div class="ic">🏬</div><h3>المخزن</h3><p style="color:var(--muted);font-size:13.5px;margin:0">الأصناف، الإدخال والإخراج، الجرد، الحركات، ملخص اليوم والمشتريات.</p></a>
      <a class="card" href="#/accounts"><div class="ic">💼</div><h3>الحسابات</h3><p style="color:var(--muted);font-size:13.5px;margin:0">الإيرادات والمصروفات يوم بيوم، رصيد كل حساب، والتحويلات.</p></a>
    </div>`;
}
window.addEventListener('hashchange', render);
document.getElementById('appBrand').firstChild.textContent = '🏬 ' + APP_CONFIG.APP_NAME;
render();
</script>
<script>
/* =====================================================================
   🔐 بوابة الدخول + صلاحيات الأقسام (المخزن / الحسابات)
   - الحساب الجديد مايشوفش أي قسم لحد ما الأدمن يديله صلاحيات
   - الأدمن بيتحكم من صفحة ⚙️ الحسابات والصلاحيات (#/admin)
   ===================================================================== */
(function(){
  const EMAIL_DOMAIN = APP_CONFIG.EMAIL_DOMAIN;
  const sb = window.__sbClient; // العميل اتعمل في بلوك الإعدادات فوق

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- الأقسام اللي الأدمن بيتحكم فيها (المخزن + الحسابات بس) ---------- */
  const GROUPS = () => [
    { title:'الأقسام', items:[
      { key:'dept:warehouse', label:'🏬 المخزن',   routes:[] },
      { key:'accounts',       label:'💼 الحسابات', routes:['accounts'] } ]},
  ];
  const allSections = () => GROUPS().flatMap(g => g.items);

  let me = null, ready = false;

  const parse = h => { const [r, p] = String(h || '').replace(/^#?\/?/, '').split('/'); return { r: r || 'home', p: p || '' }; };
  const allowedSet = () => new Set((me && me.allowed_sections) || []);

  function canSee(hash){
    if(!me) return false;
    const { r, p } = parse(hash);
    if(me.is_admin) return true;
    if(r === 'admin') return false;
    const al = allowedSet();
    if(r === 'dept') return al.has('dept:' + p);
    const secs = allSections().filter(s => (s.routes || []).includes(r));
    if(!secs.length) return al.has('home'); // أي صفحة مش معروفة بتفتح الرئيسية
    return secs.some(s => al.has(s.key));
  }
  function firstAllowed(){
    if(me.is_admin) return '#/home';
    const al = allowedSet();
    const s = allSections().find(x => al.has(x.key));
    if(!s) return null;
    return s.key.startsWith('dept:') ? '#/dept/' + s.key.slice(5) : '#/' + s.routes[0];
  }

  /* ---------- شاشة الدخول ---------- */
  function gate(inner){
    let g = document.getElementById('authGate');
    if(!g){ g = document.createElement('div'); g.id = 'authGate'; document.body.appendChild(g); }
    g.innerHTML = `<div class="ag-box"><div class="ag-brand">🏬 ${esc(APP_CONFIG.APP_NAME)}</div>${inner}</div>`;
    return g;
  }
  function hideGate(){ const g = document.getElementById('authGate'); if(g) g.remove(); }

  function showLogin(mode, msg, ok){
    mode = mode || 'login';
    const g = gate(`
      <div class="ag-sub">سجّل دخول عشان تكمل.</div>
      <div class="ag-tabs">
        <button type="button" data-mode="login" class="${mode==='login'?'on':''}">دخول</button>
        <button type="button" data-mode="signup" class="${mode==='signup'?'on':''}">حساب جديد</button>
      </div>
      ${msg ? `<div class="ag-msg ${ok?'ok':''}">${esc(msg)}</div>` : ''}
      <form id="agForm" autocomplete="on">
        ${mode==='signup' ? `<label for="agName">الاسم كامل</label><input id="agName" required>` : ''}
        <label for="agUser">اليوزرنيم</label>
        <input id="agUser" required autocomplete="username" dir="ltr" placeholder="${mode==='signup'?'حروف إنجليزي من غير مسافات':''}">
        <label for="agPass">الباسورد</label>
        <input id="agPass" type="password" required autocomplete="${mode==='signup'?'new-password':'current-password'}" dir="ltr" ${mode==='signup'?'minlength="6" placeholder="6 حروف أو أرقام على الأقل"':''}>
        <button class="ag-btn" type="submit">${mode==='signup' ? 'اعمل الحساب' : 'دخول'}</button>
      </form>`);
    g.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => showLogin(b.dataset.mode));
    g.querySelector('#agForm').onsubmit = async e => {
      e.preventDefault();
      const btn = g.querySelector('.ag-btn'); btn.disabled = true; btn.textContent = '⏳ لحظة...';
      const u = g.querySelector('#agUser').value.trim().toLowerCase();
      const p = g.querySelector('#agPass').value;
      if(mode === 'signup') await doSignup(u, g.querySelector('#agName').value.trim(), p);
      else await doLogin(u, p);
    };
  }

  async function doLogin(u, p){
    const { error } = await sb.auth.signInWithPassword({ email: u + '@' + EMAIL_DOMAIN, password: p });
    if(error) return showLogin('login', 'اليوزرنيم أو الباسورد غلط. جرب تاني.');
    location.reload(); // عشان كل الأقسام (زي الـ Squad) تقرا الجلسة الجديدة
  }

  async function doSignup(u, name, p){
    if(!/^[a-z0-9._-]{3,}$/.test(u)) return showLogin('signup', 'اليوزرنيم لازم يكون 3 حروف على الأقل، إنجليزي أو أرقام، من غير مسافات.');
    if(!name) return showLogin('signup', 'اكتب اسمك.');
    const { data, error } = await sb.auth.signUp({
      email: u + '@' + EMAIL_DOMAIN, password: p,
      options: { data: { username: u, full_name: name } }
    });
    if(error){
      const m = String(error.message || '').toLowerCase();
      return showLogin('signup', m.includes('already') ? 'اليوزرنيم ده متسجل قبل كده.' : 'حصلت مشكلة: ' + error.message);
    }
    if(data.user) await sb.from('profiles').upsert({ id: data.user.id, username: u, full_name: name });
    if(data.session) location.reload();
    else showLogin('login', 'اتعمل الحساب ✅ سجّل دخول دلوقتي.', true);
  }

  async function logout(){ await sb.auth.signOut(); location.reload(); }

  // لو التوكن خلص ومينفعش يتجدد (مثلاً الحساب اتعمله خروج من جهاز تاني) → اطلب دخول تاني بدل رسالة "JWT expired"
  let deadShown = false;
  window.addEventListener('sb-session-dead', async () => {
    if(deadShown) return; deadShown = true;
    try{ await sb.auth.signOut({ scope:'local' }); }catch(e){}
    document.documentElement.classList.remove('auth-ok');
    showLogin('login', 'جلسة الدخول خلصت — سجّل دخول تاني وكمّل من مكانك.');
  });
  // أدمن أو حساب واخد كل الأقسام = يقدر يشوف أوردرات أي حد في الـ Squad
  const isFull = () => !!me && (me.is_admin || allSections().every(s => allowedSet().has(s.key)));
  window.AuthGate = { logout, sb, me: () => me, openMenu: () => openMyMenu(), isFull };

  function showWaiting(){
    const g = gate(`
      <div class="ag-sub">أهلاً ${esc(me.full_name || me.username)} 👋</div>
      <div class="ag-msg ok">حسابك اتعمل، ومستني الأدمن يفتحلك الأقسام اللي هتشتغل عليها. لما يوافق دوس "تحديث".</div>
      <button class="ag-btn" type="button" id="agReload">🔄 تحديث</button>
      <button class="ag-btn ghost" type="button" id="agOut" style="margin-top:8px">خروج</button>`);
    g.querySelector('#agReload').onclick = () => location.reload();
    g.querySelector('#agOut').onclick = logout;
  }

  /* ---------- القائمة الجانبية ---------- */
  function filterSidebar(){
    const bar = document.getElementById('sidebar');
    if(!bar || !me) return;
    bar.querySelectorAll('a.navlink').forEach(a => {
      const href = a.getAttribute('href') || '';
      if(href.startsWith('#/')) a.style.display = canSee(href) ? '' : 'none';
    });
    bar.querySelectorAll('.grp').forEach(g => {
      const any = [...g.querySelectorAll('a.navlink')].some(a => a.style.display !== 'none');
      g.style.display = any ? '' : 'none';
    });
    if(!document.getElementById('authUser')){
      const box = document.getElementById('userbox');
      const d = document.createElement('div');
      d.id = 'authUser';
      d.innerHTML = `<span>👤 <b>${esc(me.full_name || me.username)}</b></span><button type="button" onclick="AuthGate.logout()">خروج</button>`;
      if(box) box.appendChild(d); else bar.prepend(d);
    }
    if(me.is_admin && !document.getElementById('authAdminGrp')){
      const g = document.createElement('div');
      g.className = 'grp'; g.id = 'authAdminGrp';
      g.innerHTML = `<div class="grp-title">الإدارة</div><a class="navlink" href="#/admin">⚙️ الحسابات والصلاحيات</a>`;
      bar.appendChild(g);
    }
    const r = parse(location.hash).r;
    const adm = bar.querySelector('a.navlink[href="#/admin"]');
    if(adm) adm.classList.toggle('active', r === 'admin');
  }

  function afterRender(){
    filterSidebar();
    if(parse(location.hash).r === 'admin' && me && me.is_admin) renderAdmin();
    // لو حد عمل خروج من جوه الـ Squad
    sb.auth.getSession().then(({ data }) => { if(!data.session) location.reload(); });
  }

  /* ---------- صفحة الأدمن ---------- */
  let admUsers = [];
  async function renderAdmin(){
    const main = document.getElementById('main');
    if(!main) return;
    main.innerHTML = `<div class="pagehead"><h1>⚙️ الحسابات والصلاحيات</h1>
      <p>اختار لكل حساب الأقسام اللي يشوفها ودوس حفظ. الحسابات الجديدة بتظهر فوق، ومش بتشوف أي حاجة لحد ما تديها صلاحيات.</p></div>
      <div id="admList"><div class="card"><p class="none">بيحمّل الحسابات...</p></div></div>`;
    const { data, error } = await sb.from('profiles').select('id, username, full_name, is_admin, allowed_sections');
    const list = document.getElementById('admList');
    if(!list) return;
    if(error){ list.innerHTML = `<div class="mono-note">مقدرناش نجيب الحسابات: ${esc(error.message)}</div>`; return; }
    admUsers = (data || []).map(u => ({ ...u, allowed_sections: u.allowed_sections || [] }));
    const isNew = u => !u.is_admin && !u.allowed_sections.length;
    admUsers.sort((a, b) => (isNew(b) - isNew(a)) || String(a.full_name || a.username).localeCompare(String(b.full_name || b.username), 'ar'));
    list.innerHTML = admUsers.map(userCard).join('') || '<div class="card"><p class="none">مفيش حسابات.</p></div>';
    wireAdmin(list);
  }

  function userCard(u){
    const self = me && u.id === me.id;
    const al = new Set(u.allowed_sections);
    const fresh = !u.is_admin && !al.size;
    return `<details class="adm-user" data-id="${esc(u.id)}" ${fresh ? 'open' : ''}>
      <summary>
        <span class="adm-name">${esc(u.full_name || u.username || '—')}</span>
        <span class="adm-un">@${esc(u.username || '')}</span>
        ${u.is_admin ? '<span class="adm-badge admin">أدمن — بيشوف كله</span>'
          : fresh ? '<span class="adm-badge new">جديد — مستني صلاحيات</span>'
          : `<span class="adm-badge">${al.size} قسم</span>`}
      </summary>
      <div class="adm-body">
        ${GROUPS().filter(g => g.items.length).map(g => `<div class="adm-grp"><h4>${esc(g.title)}</h4><div class="adm-checks">
          ${g.items.map(s => `<label><input type="checkbox" data-sec="${esc(s.key)}" ${al.has(s.key) ? 'checked' : ''}> ${esc(s.label)}</label>`).join('')}
        </div></div>`).join('')}
        <div class="adm-grp"><div class="adm-checks">
          <label><input type="checkbox" data-admin ${u.is_admin ? 'checked' : ''} ${self ? 'disabled' : ''}> 👑 أدمن (يشوف كل حاجة ويتحكم في الحسابات)</label>
        </div></div>
        <div class="adm-actions">
          <button type="button" data-act="all">تحديد الكل</button>
          <button type="button" data-act="none">شيل الكل</button>
          <button type="button" class="save" data-act="save">💾 حفظ</button>
          <span class="adm-st"></span>
        </div>
      </div>
    </details>`;
  }

  function wireAdmin(list){
    list.querySelectorAll('.adm-user').forEach(card => {
      const id = card.dataset.id;
      const st = card.querySelector('.adm-st');
      card.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
        const boxes = card.querySelectorAll('input[data-sec]');
        if(b.dataset.act === 'all'){ boxes.forEach(x => x.checked = true); return; }
        if(b.dataset.act === 'none'){ boxes.forEach(x => x.checked = false); return; }
        const allowed = [...boxes].filter(x => x.checked).map(x => x.dataset.sec);
        const adminBox = card.querySelector('input[data-admin]');
        const patch = { allowed_sections: allowed };
        if(!adminBox.disabled) patch.is_admin = adminBox.checked;
        b.disabled = true; st.textContent = '⏳ بيحفظ...';
        const { data, error } = await sb.from('profiles').update(patch).eq('id', id).select('id');
        b.disabled = false;
        if(error) st.textContent = '❌ ' + error.message;
        else if(!data || !data.length) st.textContent = '❌ الحفظ اترفض — اتأكد إنك شغّلت كود الـ SQL وإن حسابك أدمن.';
        else {
          st.textContent = '✅ اتحفظ — هيسري لما صاحب الحساب يعمل تحديث للصفحة';
          const u = admUsers.find(x => x.id === id);
          if(u){ u.allowed_sections = allowed; if('is_admin' in patch) u.is_admin = patch.is_admin; }
          const badge = card.querySelector('.adm-badge');
          if(badge){
            const isAdm = 'is_admin' in patch ? patch.is_admin : (u && u.is_admin);
            badge.className = 'adm-badge' + (isAdm ? ' admin' : !allowed.length ? ' new' : '');
            badge.textContent = isAdm ? 'أدمن — بيشوف كله' : !allowed.length ? 'جديد — مستني صلاحيات' : allowed.length + ' قسم';
          }
        }
      });
    });
  }

  /* ---------- 📋 زرار "الأقسام": ليستة بالأقسام المتاحة للمستخدم ---------- */
  const hrefOf = s => s.key.startsWith('dept:') ? '#/dept/' + s.key.slice(5) : '#/' + s.routes[0];
  function mySections(){
    const groups = GROUPS().map(g => ({ title:g.title, items:g.items.filter(s => canSee(hrefOf(s))).map(s => ({ label:s.label, href:hrefOf(s) })) }))
      .filter(g => g.items.length);
    if(me && me.is_admin) groups.push({ title:'الإدارة', items:[{ label:'⚙️ الحسابات والصلاحيات', href:'#/admin' }] });
    return groups;
  }
  function onMenuKey(e){ if(e.key === 'Escape') closeMyMenu(); }
  function closeMyMenu(){
    const m = document.getElementById('myMenu'); if(m) m.remove();
    document.removeEventListener('keydown', onMenuKey);
  }
  function openMyMenu(){
    if(!me) return;
    closeMyMenu();
    const groups = mySections();
    const count = groups.reduce((s, g) => s + g.items.length, 0);
    const cur = location.hash || '#/home';
    const bg = document.createElement('div');
    bg.id = 'myMenu'; bg.className = 'mm-bg';
    bg.innerHTML = `<div class="mm-box" role="dialog" aria-modal="true" aria-labelledby="mmTitle">
      <div class="mm-head"><h2 id="mmTitle">📋 الأقسام</h2><button type="button" class="mm-x" aria-label="إغلاق">✕</button></div>
      <div class="mm-sub">${count} قسم — اختار القسم للانتقال إليه.</div>
      ${count > 6 ? '<input type="search" class="mm-q" placeholder="🔍 بحث عن قسم..." aria-label="بحث عن قسم">' : ''}
      <div class="mm-list">${count ? groups.map(g => `<div class="mm-grp"><h4>${esc(g.title)}</h4><div class="mm-items">
        ${g.items.map(i => `<a class="mm-item ${cur === i.href || cur.startsWith(i.href + '/') ? 'on' : ''}" href="${i.href}" data-t="${esc(i.label)}">${esc(i.label)}</a>`).join('')}
      </div></div>`).join('') : '<div class="mm-empty">لا توجد أقسام متاحة حاليًا. برجاء التواصل مع الأدمن.</div>'}</div>
    </div>`;
    document.body.appendChild(bg);
    bg.onclick = e => { if(e.target === bg) closeMyMenu(); };
    bg.querySelector('.mm-x').onclick = closeMyMenu;
    bg.querySelectorAll('.mm-item').forEach(a => a.onclick = closeMyMenu);
    const q = bg.querySelector('.mm-q');
    if(q){
      q.oninput = () => {
        const t = q.value.trim().toLowerCase();
        bg.querySelectorAll('.mm-grp').forEach(g => {
          let any = false;
          g.querySelectorAll('.mm-item').forEach(a => { const ok = !t || a.dataset.t.toLowerCase().includes(t); a.style.display = ok ? '' : 'none'; if(ok) any = true; });
          g.style.display = any ? '' : 'none';
        });
      };
      q.focus();
    } else { const f = bg.querySelector('.mm-item'); if(f) f.focus(); }
    document.addEventListener('keydown', onMenuKey);
  }
  function addMyMenuBtn(){
    if(!me) return;
    if(!document.getElementById('myMenuBtn')){
      const b = document.createElement('button');
      b.type = 'button'; b.id = 'myMenuBtn'; b.innerHTML = '📋 الأقسام';
      b.setAttribute('aria-label', 'الأقسام');
      b.onclick = openMyMenu;
      document.body.appendChild(b);
    }
    const box = document.getElementById('userbox');
    if(box && !box.querySelector('.mm-side')){
      const s = document.createElement('button');
      s.type = 'button'; s.className = 'mm-side'; s.textContent = '📋 الأقسام';
      s.onclick = openMyMenu;
      box.appendChild(s);
    }
  }
  window.addEventListener('hashchange', closeMyMenu);

  /* ---------- الربط بالراوتر ---------- */
  // capture: بيشتغل قبل الراوتر الأصلي، فالصفحة الممنوعة ماتترسمش أصلاً
  window.addEventListener('hashchange', e => {
    if(!ready){ e.stopImmediatePropagation(); return; }
    if(!canSee(location.hash)){
      e.stopImmediatePropagation();
      const t = firstAllowed();
      if(t) location.replace(t); else showWaiting();
    }
  }, true);
  window.addEventListener('hashchange', () => { if(ready) afterRender(); });

  const _render = render;
  render = function(){
    if(ready && !canSee(location.hash)){ const t = firstAllowed(); if(t){ location.replace(t); return; } }
    _render.apply(this, arguments);
    if(ready) afterRender();
  };

  /* ---------- التشغيل ---------- */
  async function boot(){
    if(!sb){ gate('<div class="ag-msg">مكتبة الدخول ماتحمّلتش. اتأكد إن فيه إنترنت وحدّث الصفحة.</div>'); return; }
    gate('<div class="ag-sub">⏳ بيتحقق من الدخول...</div>');
    const { data: { session } } = await sb.auth.getSession();
    if(!session) return showLogin('login');

    let { data: prof, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    if(error){ gate(`<div class="ag-msg">مقدرناش نقرا بيانات حسابك: ${esc(error.message)}</div><button class="ag-btn ghost" onclick="AuthGate.logout()">خروج</button>`); return; }
    if(!prof){
      const username = session.user.email.split('@')[0];
      await sb.from('profiles').upsert({ id: session.user.id, username });
      ({ data: prof } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle());
      prof = prof || { id: session.user.id, username, allowed_sections: [], is_admin: false };
    }
    if(!('allowed_sections' in prof)){
      gate('<div class="ag-msg">نظام الصلاحيات لسه مش متفعّل في قاعدة البيانات — لازم كود الـ SQL يتشغّل في Supabase الأول.</div><button class="ag-btn ghost" onclick="AuthGate.logout()">خروج</button>');
      return;
    }
    me = { ...prof, allowed_sections: prof.allowed_sections || [] };
    ready = true;

    if(!canSee(location.hash)){
      const t = firstAllowed();
      if(!t) return showWaiting();
      location.replace(t);
    }
    document.documentElement.classList.add('auth-ok');
    hideGate();
    afterRender();
    addMyMenuBtn();

    let tm;
    const bar = document.getElementById('sidebar');
    if(bar) new MutationObserver(() => { clearTimeout(tm); tm = setTimeout(filterSidebar, 50); }).observe(bar, { childList:true, subtree:true });
  }
  boot();
})();
</script>
<style id="inv-style">
/* ===== 🏬 المخزن ===== */
.inv-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.inv-tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:14px}
.inv-tab.on{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:700}
.inv-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.inv-kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.inv-kpi .n{font-size:24px;font-weight:700}
.inv-kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px}
.inv-kpi.warn .n{color:#b3423a}
.inv-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.inv-bar input[type=search]{flex:1;min-width:200px}
.inv-in{padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:14.5px;font-family:inherit;background:var(--panel);color:var(--ink);box-sizing:border-box;width:100%}
.inv-in:focus{outline:none;border-color:var(--brass)}
.inv-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 13px;font-family:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.inv-btn.pri{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:700}
.inv-btn.green{background:#276749;border-color:#276749;color:#fff}
.inv-btn.red{background:#b3423a;border-color:#b3423a;color:#fff}
.inv-btn.sm{padding:3px 9px;font-size:12px}
.inv-btn:disabled{opacity:.55;cursor:default}
.inv-tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.inv-tag.ok{background:#e8f3ec;color:#276749}
.inv-tag.low{background:#fdf3e1;color:#9a6b14}
.inv-tag.out{background:#fdecea;color:#b3423a}
.inv-tag.in{background:#e8f3ec;color:#276749}
.inv-tag.adj{background:#e9eef7;color:#3b5b92}
.inv-msg{padding:10px 13px;border-radius:9px;margin-bottom:14px;font-size:14px;background:#e8f3ec;color:#276749}
.inv-msg.err{background:#fdecea;color:#b3423a}
.inv-line{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center;margin-bottom:8px}
.inv-line .avail{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:-4px}
/* 🔍 قايمة اختيار الصنف — أول حاجة فيها السيرش بار */
.inv-dd{position:relative;min-width:0}
.inv-dd-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;text-align:right}
.inv-dd-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-dd-btn.ph span{color:var(--muted)}
.inv-dd-btn.open{border-color:var(--brass)}
.inv-dd-panel{position:absolute;top:calc(100% + 4px);inset-inline:0;z-index:40;background:var(--panel);border:1.5px solid var(--brass);border-radius:9px;box-shadow:0 10px 26px rgba(0,0,0,.15);padding:8px}
.inv-search{background:var(--paper);margin-bottom:6px}
.inv-search::placeholder{color:var(--muted);opacity:.7;font-weight:300}
.inv-dd-list{max-height:300px;overflow-y:auto}
.inv-dd-opt{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.inv-dd-opt:hover,.inv-dd-opt.first{background:var(--slate-l)}
.inv-dd-opt.sel{font-weight:700;color:var(--brass-d)}
.inv-dd-opt small{color:var(--muted);white-space:nowrap}
.inv-dd-empty{padding:10px;color:var(--muted);font-size:13px;text-align:center}
.inv-form label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 5px}
.inv-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
table.pr td.num{font-weight:700}
table.pr tr.low td{background:#fffaf0}
table.pr tr.out td{background:#fff5f4}
.inv-count-in{width:100px;padding:5px 8px;border:1.5px solid var(--line);border-radius:7px;font-family:inherit;text-align:center;background:var(--panel);color:var(--ink)}
.inv-diff.plus{color:#276749;font-weight:700}
.inv-diff.minus{color:#b3423a;font-weight:700}
@media (max-width:600px){.inv-line{grid-template-columns:1fr 90px auto}}
</style>
<script>
/* =====================================================================
   🏬 المخزن — أصناف / إدخال / إخراج / جرد / سجل حركات (Supabase)
   بيحل مكان صفحة القسم #/dept/warehouse
   ===================================================================== */
(function(){
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtN = n => Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 });
  const toNum = v => { const x = parseFloat(String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g, '')); return isNaN(x) ? null : x; };
  const where = () => { const [r, p] = (location.hash.replace('#/', '') || 'home').split('/'); return { r, p }; };
  const isInv = () => { const w = where(); return w.r === 'dept' && w.p === 'warehouse'; };
  const sb = () => window.AuthGate && window.AuthGate.sb;
  const me = () => (window.AuthGate && window.AuthGate.me && window.AuthGate.me()) || {};
  const myName = () => me().full_name || me().username || '';

  const TABS = [
    ['stock', '📦 المخزون'], ['in', '➕ إدخال'], ['out', '➖ إخراج'],
    ['count', '📋 جرد'], ['moves', '🕘 الحركات'], ['day', '🗓️ ملخص اليوم'], ['buy', '📊 المشتريات'], ['items', '🏷️ الأصناف']
  ];
  const KIND = { in: ['إدخال', 'in'], out: ['إخراج', 'out'], adjust: ['تسوية جرد', 'adj'] };
  const SRC = { purchase:'🛒 مشتريات من مورد', return:'↩️ مرتجع من عميل', other:'📥 إدخال تاني' };
  const moveLabel = m => m.kind !== 'in' ? (KIND[m.kind] || [m.kind])[0]
    : m.source === 'purchase' ? 'مشتريات' : m.source === 'return' ? 'مرتجع' : m.source === 'opening' ? 'رصيد أول المدة' : 'إدخال';
  const isPurchase = m => m.kind === 'in' && (m.source === 'purchase' || (!m.source && m.note !== 'رصيد أول المدة'));
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  // 🔍 بحث الأصناف في الإدخال والإخراج:
  // بيوحّد أ/إ/آ = ا ، ة = ه ، ى = ي ، والأرقام العربي = إنجليزي، وبيدوّر بأكتر من كلمة
  const SEARCH_PH = '🔍 سيرش بار اهو عشان منعدش ندور كتير';
  const normQ = s => String(s ?? '').toLowerCase()
    .replace(/[\u064B-\u0652\u0640]/g, '')
    .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/\s+/g, ' ').trim();
  let ddOpen = null, ddQ = ''; // رقم السطر اللي قايمته مفتوحة + كلام السيرش
  function matchItems(q){
    const words = normQ(q).split(' ').filter(Boolean);
    if(!words.length) return active();
    return active().filter(i => {
      const t = normQ([i.name, i.sku, i.category].filter(Boolean).join(' '));
      return words.every(w => t.includes(w));
    });
  }

  let S = { tab:'stock', items:null, moves:null, loading:false, busy:false, err:'', msg:'', q:'', mq:'',
            lines:[{ item:'', qty:'' }], note:'', countNote:'', count:{}, editing:null,
            showLow:false, req:{}, src:'purchase', resetMode:'moves', resetTxt:'',
            day: ymd(new Date()), dayData:null, dayLoading:false, dayErr:'', dayNote:'',
            buy:null, buyLoading:false, buyErr:'', buyFrom: ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 1)), buyTo: ymd(new Date()), target:(() => { try{ return Number(localStorage.getItem('inv_target')) || 300; }catch(e){ return 300; } })() };

  const active = () => (S.items || []).filter(i => i.active !== false);
  const itemById = id => (S.items || []).find(i => String(i.id) === String(id));
  function status(i){
    const q = Number(i.qty || 0), m = Number(i.min_qty || 0);
    if(q <= 0) return ['خلص', 'out'];
    if(m > 0 && q <= m) return ['قليل', 'low'];
    return ['متاح', 'ok'];
  }

  /* ---------- البيانات ---------- */
  async function load(){
    if(!sb()) return;
    S.loading = true; S.err = ''; draw();
    const [a, b] = await Promise.all([
      sb().from('inv_stock').select('*').order('name'),
      sb().from('inv_moves').select('*, inv_items(name, unit)').order('created_at', { ascending:false }).limit(500)
    ]);
    S.loading = false;
    const e = a.error || b.error;
    if(e){
      S.err = /does not exist|relation|schema cache|Could not find/i.test(e.message)
        ? 'جداول المخزن لسه مش موجودة في Supabase — لازم كود الـ SQL يتشغّل الأول.'
        : 'مقدرناش نجيب بيانات المخزن: ' + e.message;
    } else { S.items = a.data || []; S.moves = b.data || []; S.dayData = null; if(S.tab === 'day') setTimeout(loadDay, 0); }
    draw();
  }

  function flash(msg, isErr){ S.msg = msg; S.msgErr = !!isErr; draw(); window.scrollTo({ top:0, behavior:'smooth' }); }

  /* ---------- الرسم ---------- */
  function draw(){
    if(!isInv()) return;
    const main = document.getElementById('main'); if(!main) return;
    const f = document.activeElement, fid = f && f.id, pos = f && f.selectionStart;
    main.innerHTML = view();
    wire(main);
    if(fid){ const n = document.getElementById(fid); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} } }
  }

  function view(){
    const tabs = me().is_admin ? [...TABS, ['admin', '🧹 تصفير ونسخة احتياطية']] : TABS;
    if(S.tab === 'admin' && !me().is_admin) S.tab = 'stock';
    let h = `<div class="pagehead"><h1>🏬 المخزن</h1><p>إدخال وإخراج الأصناف، والمخزون الحالي، والجرد — كله متسجل باسم اللي عمله.</p></div>
      <div class="inv-tabs">${tabs.map(([k, l]) => `<button class="inv-tab ${S.tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}
        <button class="inv-btn" data-act="reload" style="margin-inline-start:auto">🔄 تحديث</button></div>`;
    if(S.msg) h += `<div class="inv-msg ${S.msgErr ? 'err' : ''}">${esc(S.msg)}</div>`;
    if(S.err) return h + `<div class="inv-msg err">${esc(S.err)}</div>`;
    if(S.items === null) return h + `<div class="card"><p class="none">⏳ بيحمّل المخزن...</p></div>`;
    if(!S.items.length && S.tab !== 'items' && S.tab !== 'admin')
      return h + `<div class="card"><p class="none" style="margin-bottom:10px">لسه مفيش أصناف. ابدأ بإضافة الأصناف ورصيدها الحالي.</p><button class="inv-btn pri" data-tab="items">🏷️ ضيف أول صنف</button></div>`;
    return h + ({ stock:vStock, in:() => vMove('in'), out:() => vMove('out'), count:vCount, moves:vMoves, day:vDay, buy:vBuy, items:vItems, admin:vAdmin }[S.tab])();
  }

  function vStock(){
    const q = S.q.trim().toLowerCase();
    const list = active().filter(i => !q || [i.name, i.sku, i.category].some(v => String(v || '').toLowerCase().includes(q)));
    const all = active();
    const low = all.filter(i => status(i)[1] !== 'ok').length;
    const pcs = all.reduce((s, i) => s + Number(i.qty || 0), 0);
    const val = all.reduce((s, i) => s + Number(i.qty || 0) * Number(i.cost || 0), 0);
    return `<div class="inv-kpis">
        <div class="inv-kpi"><div class="n">${fmtN(all.length)}</div><div class="l">عدد الأصناف</div></div>
        <div class="inv-kpi"><div class="n">${fmtN(pcs)}</div><div class="l">إجمالي القطع في المخزن</div></div>
        <div class="inv-kpi ${low ? 'warn' : ''}" data-act="low" style="cursor:pointer;${S.showLow ? 'border-color:var(--brass);border-width:2px' : ''}"><div class="n">${fmtN(low)}</div><div class="l">⚠️ أصناف خلصت أو قربت تخلص · ${S.showLow ? 'دوس تقفل' : 'دوس تشوفهم'}</div></div>
        ${val ? `<div class="inv-kpi"><div class="n">${fmtN(Math.round(val))} ج</div><div class="l">قيمة المخزون (بسعر التكلفة)</div></div>` : ''}
      </div>
      ${S.showLow ? vLow() : ''}
      <div class="card">
        <div class="inv-bar">
          <input type="search" id="invQ" class="inv-in" placeholder="🔍 دوّر باسم الصنف أو الكود أو التصنيف..." value="${esc(S.q)}">
          ${window.XLSX ? '<button class="inv-btn" data-act="xlsx">⬇️ Excel</button>' : ''}
          <button class="inv-btn" data-act="today-sum">🗓️ ملخص النهارده</button>
        </div>
        <div class="tablewrap" style="max-height:560px;overflow-y:auto"><table class="pr">
          <tr><th>الصنف</th><th>الكود</th><th>التصنيف</th><th>الكمية</th><th>الحد الأدنى</th><th>الحالة</th><th></th></tr>
          ${list.map(i => { const [t, c] = status(i); return `<tr class="${c === 'ok' ? '' : c}">
            <td class="lbl">${esc(i.name)}</td><td>${esc(i.sku || '—')}</td><td>${esc(i.category || '—')}</td>
            <td class="num">${fmtN(i.qty)} <span style="font-weight:400;color:var(--muted)">${esc(i.unit || '')}</span></td>
            <td>${i.min_qty ? fmtN(i.min_qty) : '—'}</td>
            <td><span class="inv-tag ${c}">${t}</span></td>
            <td><button class="inv-btn sm green" data-quick="in" data-id="${i.id}">+ إدخال</button> <button class="inv-btn sm red" data-quick="out" data-id="${i.id}" ${Number(i.qty) > 0 ? '' : 'disabled'}>− إخراج</button></td>
          </tr>`; }).join('') || '<tr><td colspan="7" class="none">مفيش نتايج.</td></tr>'}
        </table></div>
      </div>`;
  }

  /* ---------- النواقص ---------- */
  function lowItems(){
    return active().filter(i => status(i)[1] !== 'ok').sort((a, b) => Number(a.qty || 0) - Number(b.qty || 0));
  }
  function lowRows(){
    return lowItems().map(i => {
      const def = Math.max(0, S.target - Number(i.qty || 0));
      const v = S.req[i.id];
      const n = (v === undefined || v === '') ? def : (toNum(v) || 0);
      return { i, def, need: Math.max(0, n) };
    });
  }
  function vLow(){
    const rows = lowRows();
    if(!rows.length) return `<div class="card" id="invLow"><p class="none">🎉 مفيش أصناف خلصت أو قربت تخلص.</p></div>`;
    const total = rows.reduce((a, r) => a + r.need, 0);
    return `<div class="card" id="invLow">
      <div class="inv-bar" style="justify-content:space-between">
        <h3 style="margin:0">⚠️ النواقص — ${fmtN(rows.length)} صنف</h3>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <label for="invTarget" style="font-size:13px;color:var(--muted)">نكمّل كل صنف لـ</label>
          <input id="invTarget" class="inv-count-in" type="number" min="1" step="1" value="${esc(S.target)}">
          <span style="font-size:13px;color:var(--muted)">قطعة</span>
          <button class="inv-btn pri" data-act="print-low">🖨️ اطبع فاتورة النواقص</button>
        </div>
      </div>
      <div class="tablewrap"><table class="pr">
        <tr><th>الصنف</th><th>الكود</th><th>التصنيف</th><th>الموجود</th><th>الحد الأدنى</th><th>الحالة</th><th>ناقص (المطلوب)</th></tr>
        ${rows.map(({ i, def, need }) => { const [t, c] = status(i); return `<tr class="${c}">
          <td class="lbl">${esc(i.name)}</td><td>${esc(i.sku || '—')}</td><td>${esc(i.category || '—')}</td>
          <td class="num">${fmtN(i.qty)} <span style="font-weight:400;color:var(--muted)">${esc(i.unit || '')}</span></td>
          <td>${i.min_qty ? fmtN(i.min_qty) : '—'}</td><td><span class="inv-tag ${c}">${t}</span></td>
          <td><input class="inv-count-in" id="invR${i.id}" data-req="${i.id}" type="number" min="0" step="any" value="${esc(S.req[i.id] ?? def)}"></td>
        </tr>`; }).join('')}
        <tr class="total"><td class="lbl">الإجمالي المطلوب</td><td colspan="5"></td><td id="invLowTotal">${fmtN(total)}</td></tr>
      </table></div>
      <p class="none" style="margin-top:8px">"المطلوب" = ${fmtN(S.target)} ناقص الموجود. تقدر تعدّل أي رقم قبل الطباعة، والأصناف اللي مطلوبها صفر مش هتطلع في الفاتورة.</p>
    </div>`;
  }

  function printShortage(){
    const rows = lowRows().filter(r => r.need > 0);
    if(!rows.length) return flash('مفيش كميات مطلوبة عشان تتطبع.', true);
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const no = 'NQ-' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '-' + pad(now.getHours()) + pad(now.getMinutes());
    const hasCost = rows.some(r => Number(r.i.cost) > 0);
    const totalQty = rows.reduce((a, r) => a + r.need, 0);
    const totalCost = rows.reduce((a, r) => a + r.need * Number(r.i.cost || 0), 0);
    const n = v => Number(v || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 });
    const html = `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>فاتورة نواقص ${no}</title>
<style>
  *{box-sizing:border-box} body{font-family:Tahoma,Arial,sans-serif;color:#1c2321;margin:0;padding:28px}
  .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #8a6d3b;padding-bottom:12px;margin-bottom:18px}
  h1{margin:0;font-size:26px} .co{color:#666;font-size:13px;margin-top:4px}
  .meta{font-size:13px;line-height:1.9;text-align:left} .meta b{color:#000}
  table{width:100%;border-collapse:collapse;font-size:13.5px} th,td{border:1px solid #bbb;padding:8px;text-align:center}
  th{background:#3d5553;color:#fff} td.r{text-align:right;font-weight:600} tr:nth-child(even) td{background:#f7f5f0}
  .tot td{background:#ffe699 !important;font-weight:700}
  .note{font-size:12.5px;color:#666;margin-top:10px}
  .sig{display:flex;justify-content:space-between;gap:30px;margin-top:60px;font-size:14px}
  .sig div{flex:1;border-top:1px solid #333;padding-top:6px;text-align:center}
  @media print{body{padding:10mm} @page{size:A4;margin:8mm}}
</style></head><body>
  <div class="hd">
    <div><h1>🧾 فاتورة نواقص</h1><div class="co">طلب توريد أصناف للمخزن</div></div>
    <div class="meta">رقم: <b>${no}</b><br>التاريخ: <b>${now.toLocaleDateString('ar-EG', { day:'numeric', month:'long', year:'numeric' })}</b><br>طلب بواسطة: <b>${esc(myName() || '—')}</b></div>
  </div>
  <table>
    <tr><th>م</th><th>الصنف</th><th>الكود</th><th>التصنيف</th><th>الموجود</th><th>الكمية المطلوبة</th>${hasCost ? '<th>تكلفة الوحدة</th><th>الإجمالي</th>' : ''}</tr>
    ${rows.map((r, k) => `<tr><td>${n(k + 1)}</td><td class="r">${esc(r.i.name)}</td><td>${esc(r.i.sku || '—')}</td><td>${esc(r.i.category || '—')}</td>
      <td>${n(r.i.qty)}</td><td><b>${n(r.need)}</b> ${esc(r.i.unit || '')}</td>
      ${hasCost ? `<td>${r.i.cost ? n(r.i.cost) : '—'}</td><td>${r.i.cost ? n(r.need * r.i.cost) : '—'}</td>` : ''}</tr>`).join('')}
    <tr class="tot"><td colspan="5">الإجمالي — ${n(rows.length)} صنف</td><td>${n(totalQty)}</td>${hasCost ? `<td></td><td>${n(Math.round(totalCost))} ج</td>` : ''}</tr>
  </table>
  <div class="note">الكمية المطلوبة محسوبة عشان يوصل كل صنف لـ ${n(S.target)} قطعة.</div>
  <div class="sig"><div>توقيع مسؤول المخزن</div><div>اعتماد الإدارة</div><div>استلام المورد</div></div>
</body></html>`;
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;left:-9999px;top:0;width:900px;height:1200px;border:0';
    document.body.appendChild(f);
    f.contentDocument.open(); f.contentDocument.write(html); f.contentDocument.close();
    setTimeout(() => { try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} setTimeout(() => f.remove(), 2000); }, 300);
  }

  /* ---------- 📊 تقرير المشتريات ---------- */
  function setRange(k){
    const t = new Date(), y = t.getFullYear(), mo = t.getMonth();
    const map = {
      month: [new Date(y, mo, 1), t],
      last:  [new Date(y, mo - 1, 1), new Date(y, mo, 0)],
      d30:   [new Date(t.getTime() - 29 * 864e5), t],
      year:  [new Date(y, 0, 1), t],
    };
    const [a, b] = map[k] || map.month;
    S.buyFrom = ymd(a); S.buyTo = ymd(b);
  }
  async function loadBuy(){
    if(!S.buyFrom || !S.buyTo) return;
    if(S.buyFrom > S.buyTo){ S.buyErr = 'تاريخ "من" لازم يكون قبل "إلى".'; draw(); return; }
    S.buyLoading = true; S.buyErr = ''; draw();
    const { data, error } = await sb().from('inv_moves')
      .select('*, inv_items(name, sku, category, unit, cost)')
      .eq('kind', 'in')

    else S.buy = (data || []).filter(isPurchase);

  function buyCalc(){
    const g = {}; let qty = 0, cost = 0, missing = 0, est = 0;
    (S.buy || []).forEach(m => {
      const it = m.inv_items || {};
      const uc = m.unit_cost != null ? Number(m.unit_cost) : (it.cost != null ? Number(it.cost) : null);
      if(m.unit_cost == null && uc != null) est++;
      const r = g[m.item_id] = g[m.item_id] || { name: it.name || '—', sku: it.sku, cat: it.category, unit: it.unit, qty: 0, costed: 0, cost: 0, times: 0, missing: 0 };
      r.qty += Number(m.qty); r.times++; qty += Number(m.qty);
      if(uc == null){ r.missing++; missing++; }
      else { r.cost += uc * Number(m.qty); r.costed += Number(m.qty); cost += uc * Number(m.qty); }
    });
    const rows = Object.values(g).sort((a, b) => b.cost - a.cost || b.qty - a.qty);
    return { rows, qty, cost, missing, est, count: (S.buy || []).length };
  }

    // [المفتاح، العنوان، يظهر القيمة بالجنيه؟]

  async function loadDay(){
    if(!S.day || S.items === null || !sb()) return;
    S.dayLoading = true; S.dayErr = ''; draw();
    const start = new Date(S.day + 'T00:00:00'), endT = new Date(S.day + 'T23:59:59.999').getTime();
    // بنجيب حركات اليوم وكل اللي بعده عشان نرجّع الرصيد لأول وآخر اليوم
    const { data, error } = await sb().from('inv_moves')
      .select('*, inv_items(name, unit, cost)')
      .gte('created_at', start.toISOString())
      .order('created_at', { ascending:true }).limit(20000);
    S.dayLoading = false;
    if(error){ S.dayErr = 'مقدرناش نجيب حركات اليوم: ' + error.message; S.dayData = null; draw(); return; }
    const dayMoves = [], after = [];
    (data || []).forEach(m => (new Date(m.created_at).getTime() <= endT ? dayMoves : after).push(m));
    S.dayData = calcDay(dayMoves, after);
    draw();
  }

  function calcDay(dayMoves, after){
    const sumBy = list => { const o = {}; list.forEach(m => o[m.item_id] = (o[m.item_id] || 0) + Number(m.qty)); return o; };
    const aft = sumBy(after), dd = sumBy(dayMoves);
    let vB = 0, vA = 0, pB = 0, pA = 0, noCost = 0;
    (S.items || []).forEach(i => {
      const qA = Number(i.qty || 0) - (aft[i.id] || 0); // الرصيد آخر اليوم
      const qB = qA - (dd[i.id] || 0);                   // الرصيد أول اليوم
      pA += qA; pB += qB;
      if(i.cost != null && i.cost !== ''){ vA += qA * Number(i.cost); vB += qB * Number(i.cost); }
      else if(qA || qB) noCost++;
    });
    const groups = { purchase:[], return:[], otherIn:[], out:[], adjust:[] };
    dayMoves.forEach(m => {
      const g = m.kind === 'out' ? 'out' : m.kind === 'adjust' ? 'adjust'
        : m.source === 'return' ? 'return' : isPurchase(m) ? 'purchase' : 'otherIn';
      groups[g].push(m);
    });
    const agg = list => {
      const o = {};
      list.forEach(m => {
        const it = m.inv_items || itemById(m.item_id) || {};
        const r = o[m.item_id] = o[m.item_id] || { name: it.name || '—', unit: it.unit || '', qty: 0, value: 0, notes: [] };
        r.qty += Number(m.qty);
        const uc = m.unit_cost != null ? Number(m.unit_cost) : (it.cost != null ? Number(it.cost) : 0);
        r.value += Math.abs(Number(m.qty)) * uc;
        if(m.note && !r.notes.includes(m.note)) r.notes.push(m.note);
      });
      const rows = Object.values(o).sort((a, b) => Math.abs(b.qty) - Math.abs(a.qty));
      return { rows, qty: rows.reduce((s, r) => s + r.qty, 0), value: rows.reduce((s, r) => s + r.value, 0), n: list.length };
    };
    const G = {}; Object.keys(groups).forEach(k => G[k] = agg(groups[k]));
    const people = [...new Set(dayMoves.map(m => m.created_by_name).filter(Boolean))];
    return { day: S.day, G, count: dayMoves.length, vB, vA, pB, pA, noCost, people };
  }

      L.push(`*${lbl}* — ${fmtN(g.rows.length)} صنف · ${tot} قطعة${money && g.value ? ' · ' + fmtN(Math.round(g.value)) + ' ج' : ''}`);
      g.rows.slice(0, 15).forEach(r => L.push(`• ${r.name}: ${k === 'adjust' ? sgn(r.qty) : fmtN(Math.abs(r.qty))}`));
      if(g.rows.length > 15) L.push(`• و ${fmtN(g.rows.length - 15)} صنف كمان`);
      L.push('');
    });
    if(D.day === ymd(new Date())){
      const lows = lowItems();
      if(lows.length){
        L.push(`*⚠️ نواقص دلوقتي* — ${fmtN(lows.length)} صنف`);
        lows.slice(0, 15).forEach(i => L.push(`• ${i.name}: فاضل ${fmtN(i.qty)}`));
        if(lows.length > 15) L.push(`• و ${fmtN(lows.length - 15)} صنف كمان`);
        L.push('');
      }
    }
    L.push(`💰 *قيمة المخزن:* أول اليوم ${fmtN(Math.round(D.vB))} ج ← آخر اليوم ${fmtN(Math.round(D.vA))} ج (${sgn(Math.round(D.vA - D.vB))} ج)`);
    L.push(`📦 *عدد القطع:* ${fmtN(D.pB)} ← ${fmtN(D.pA)} (${sgn(D.pA - D.pB)})`);
    if(D.people.length) L.push('👤 بواسطة: ' + D.people.join('، '));
    if(S.dayNote.trim()) L.push('📝 ملاحظات: ' + S.dayNote.trim());
    if(myName()) L.push('📤 اتبعت من: ' + myName());
    return L.join('\n');
  }

  // بيجيب كل الصفوف على دفعات (Supabase بيرجّع 1000 بالكتير في المرة)
  async function fetchAll(table, select, order){
    const out = [];
    for(let from = 0; ; from += 1000){
      const { data, error } = await sb().from(table).select(select)
        .order(order, { ascending:true }).range(from, from + 999);
      if(error) throw new Error(error.message);
      out.push(...(data || []));
      if(!data || data.length < 1000) break;
    }
    return out;
  }

  async function downloadBackup(){
    if(!window.XLSX) throw new Error('مكتبة الإكسل ماتحمّلتش — حدّث الصفحة.');
    const [items, moves] = await Promise.all([
      fetchAll('inv_stock', '*', 'name'),
      fetchAll('inv_moves', '*, inv_items(name, sku, unit)', 'created_at')
    ]);
    const sheet = rows => XLSX.utils.json_to_sheet(rows.length ? rows : [{ 'ملاحظة': 'مفيش بيانات' }]);
    const wb = XLSX.utils.book_new();

    // 1) المخزون الحالي
    XLSX.utils.book_append_sheet(wb, sheet(items.filter(i => i.active !== false).map(i => ({
      'الصنف': i.name, 'الكود': i.sku || '', 'التصنيف': i.category || '', 'الكمية': Number(i.qty || 0),
      'الوحدة': i.unit || '', 'الحد الأدنى': Number(i.min_qty || 0), 'التكلفة': i.cost ?? '',
      'قيمة المخزون': i.cost != null ? Number(i.qty || 0) * Number(i.cost) : '', 'الحالة': status(i)[0] }))), 'المخزون الحالي');

    // 2) كل الأصناف (حتى المتوقفة)
    XLSX.utils.book_append_sheet(wb, sheet(items.map(i => ({
      'رقم الصنف': i.id, 'الصنف': i.name, 'الكود': i.sku || '', 'التصنيف': i.category || '', 'الوحدة': i.unit || '',
      'الحد الأدنى': Number(i.min_qty || 0), 'التكلفة': i.cost ?? '', 'الكمية': Number(i.qty || 0),
      'نشط': i.active === false ? 'متوقف' : 'نشط' }))), 'كل الأصناف');

    // 3) ملخص كل صنف من الحركات
    const sm = {};
    moves.forEach(m => {
      const it = m.inv_items || {};
      const r = sm[m.item_id] = sm[m.item_id] || { 'الصنف': it.name || '—', 'الكود': it.sku || '', 'رصيد أول المدة': 0,
        'مشتريات': 0, 'مرتجعات': 0, 'إدخال تاني': 0, 'إخراج': 0, 'تسويات جرد': 0, 'تكلفة المشتريات': 0, 'الرصيد': 0 };
      const q = Number(m.qty);
      r['الرصيد'] += q;
      if(m.kind === 'out') r['إخراج'] += Math.abs(q);
      else if(m.kind === 'adjust') r['تسويات جرد'] += q;
      else if(m.source === 'opening' || m.note === 'رصيد أول المدة') r['رصيد أول المدة'] += q;
      else if(m.source === 'return') r['مرتجعات'] += q;
      else if(isPurchase(m)){ r['مشتريات'] += q; if(m.unit_cost != null) r['تكلفة المشتريات'] += q * Number(m.unit_cost); }
      else r['إدخال تاني'] += q;
    });
    XLSX.utils.book_append_sheet(wb, sheet(Object.values(sm)), 'ملخص كل صنف');

    // 4) كل الحركات من أول يوم
    XLSX.utils.book_append_sheet(wb, sheet(moves.map(m => {
      const it = m.inv_items || {}, d = new Date(m.created_at);
      return { 'التاريخ': ymd(d), 'الوقت': d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }),
        'الصنف': it.name || '', 'الكود': it.sku || '', 'النوع': moveLabel(m), 'الكمية': Number(m.qty), 'الوحدة': it.unit || '',
        'سعر القطعة': m.unit_cost ?? '', 'الإجمالي': m.unit_cost != null ? Math.abs(Number(m.qty)) * Number(m.unit_cost) : '',
        'ملاحظة': m.note || '', 'بواسطة': m.created_by_name || '' };
    })), 'كل الحركات');

    const now = new Date();
    XLSX.writeFile(wb, `نسخة المخزن الكاملة ${ymd(now)} ${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}.xlsx`);
    return { items: items.length, moves: moves.length };
  }

  async function resetInv(){
    if(!me().is_admin) return flash('التصفير للأدمن بس.', true);
    if(S.resetTxt.trim() !== RESET_WORD) return flash(`اكتب "${RESET_WORD}" بالظبط عشان تأكد.`, true);
    const all = S.resetMode === 'all';
    if(!confirm(all ? 'متأكد؟ هتتمسح كل الأصناف وكل الحركات نهائيًا.' : 'متأكد؟ هتتمسح كل الحركات والأرصدة هترجع صفر.')) return;
    S.busy = true; S.msg = '⏳ بينزّل نسخة احتياطية الأول...'; S.msgErr = false; draw();
    try{ await downloadBackup(); }
    catch(e){ S.busy = false; return flash('❌ النسخة الاحتياطية فشلت، فماتمسحش حاجة: ' + e.message, true); }
    S.msg = '⏳ بيصفّر المخزن...'; draw();
    const { error } = await sb().rpc('inv_reset', { keep_items: !all });
    S.busy = false;
    if(error) return flash(/admins only/i.test(error.message) ? '❌ التصفير للأدمن بس.'

    S.resetTxt = ''; S.buy = null; S.dayData = null; S.count = {}; S.req = {}; S.lines = [{ item:'', qty:'' }]; S.note = '';
    S.tab = all ? 'items' : 'stock';

        ${(S.items || []).map(i => `<tr style="${i.active === false ? 'opacity:.5' : ''}">
          <td class="lbl">${esc(i.name)}${i.active === false ? ' <span class="inv-tag">متوقف</span>' : ''}</td><td>${esc(i.sku || '—')}</td><td>${esc(i.category || '—')}</td>
          <td>${esc(i.unit || '—')}</td><td>${i.min_qty ? fmtN(i.min_qty) : '—'}</td><td>${i.cost ? fmtN(i.cost) : '—'}</td><td class="num">${fmtN(i.qty)}</td>
          <td><button class="inv-btn sm" data-edit="${i.id}">✏️ تعديل</button> <button class="inv-btn sm" data-toggle="${i.id}">${i.active === false ? '↩️ رجّعه' : '⏸️ وقّفه'}</button></td>
        </tr>`).join('') || '<tr><td colspan="8" class="none">لسه مفيش أصناف.</td></tr>'}
      </table></div>
      <p class="none" style="margin-top:8px">الصنف "المتوقف" بيختفي من المخزون والإدخال والإخراج، بس حركاته القديمة بتفضل محفوظة.</p>
    </div>`;
  }

  /* ---------- الأحداث ---------- */
  function wire(root){
    root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.msg = ''; S.editing = null; S.draft = null; draw(); if(S.tab === 'buy' && S.buy === null && !S.buyLoading) loadBuy(); if(S.tab === 'day' && !S.dayData && !S.dayLoading) loadDay(); });
    root.querySelectorAll('[data-act=reload]').forEach(b => b.onclick = () => { S.msg = ''; load(); });
    root.querySelectorAll('[data-quick]').forEach(b => b.onclick = () => {
      S.tab = b.dataset.quick; S.lines = [{ item:b.dataset.id, qty:'' }]; S.note = ''; S.msg = ''; draw();
      const q = document.getElementById('invQty0'); if(q) q.focus();
    });
    const q = root.querySelector('#invQ'); if(q) q.oninput = () => { S.q = q.value; draw(); };
    const mq = root.querySelector('#invMQ'); if(mq) mq.oninput = () => { S.mq = mq.value; draw(); };

    // 🔽 فتح/قفل قايمة الصنف — أول ما تفتح المؤشر بيقف في السيرش بار
    root.querySelectorAll('[data-dd]').forEach(b => b.onclick = () => {
      const idx = +b.dataset.dd;
      ddOpen = ddOpen === idx ? null : idx; ddQ = '';
      draw();
      const s = document.getElementById('invS' + idx); if(s) s.focus();
    });
    const pick = (idx, id) => {
      S.lines[idx].item = String(id); ddOpen = null; ddQ = '';
      draw();
      const qn = document.getElementById('invQty' + idx); if(qn) qn.focus();
    };
    root.querySelectorAll('[data-search]').forEach(el => {
      const idx = +el.dataset.search;
      const wirePicks = () => document.querySelectorAll('#invL' + idx + ' [data-pick]').forEach(o => o.onclick = () => pick(idx, o.dataset.pick));
      wirePicks();
      el.oninput = () => {
        ddQ = el.value;
        const list = document.getElementById('invL' + idx);
        if(list){ list.innerHTML = ddListHtml(S.lines[idx].item, ddQ); wirePicks(); }
      };
      el.onkeydown = e => {
        if(e.key === 'Escape'){ ddOpen = null; ddQ = ''; draw(); return; }
        if(e.key !== 'Enter') return;
        e.preventDefault();
        const hits = matchItems(ddQ);
        if(hits.length) pick(idx, hits[0].id);
      };
    });

    root.querySelectorAll('[data-line]').forEach(el => {
      const upd = () => { S.lines[+el.dataset.line][el.dataset.f] = el.value; };
      el.oninput = () => { upd(); const av = document.getElementById('invAv' + el.dataset.line);
        if(av) av.innerHTML = availHtml(S.lines[+el.dataset.line], S.tab === 'in' && S.src === 'purchase'); };
      if(el.tagName === 'SELECT') el.onchange = () => { upd(); draw(); };
    });
    root.querySelectorAll('[data-del-line]').forEach(b => b.onclick = () => { S.lines.splice(+b.dataset.delLine, 1); ddOpen = null; draw(); });
    const add = root.querySelector('[data-act=addline]'); if(add) add.onclick = () => {
      S.lines.push({ item:'', qty:'' }); ddOpen = null; draw();
    };
    const note = root.querySelector('#invNote'); if(note) note.oninput = () => { S.note = note.value; };
    root.querySelectorAll('[data-src]').forEach(b => b.onclick = () => { S.src = b.dataset.src; draw(); });
    const bf = root.querySelector('#buyFrom'); if(bf) bf.onchange = () => { S.buyFrom = bf.value; };
    const bt = root.querySelector('#buyTo'); if(bt) bt.onchange = () => { S.buyTo = bt.value; };
    const bg = root.querySelector('[data-act=buy-go]'); if(bg) bg.onclick = loadBuy;
    root.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { setRange(b.dataset.range); loadBuy(); });
    const bx = root.querySelector('[data-act=buy-xlsx]'); if(bx) bx.onclick = exportBuy;
    const bp = root.querySelector('[data-act=buy-print]'); if(bp) bp.onclick = printBuy;
    const sm = root.querySelector('[data-act=save-move]'); if(sm) sm.onclick = () => saveMove(sm.dataset.kind);

    root.querySelectorAll('[data-count]').forEach(el => el.oninput = () => {
      S.count[el.dataset.count] = el.value;
      const it = itemById(el.dataset.count), cell = root.querySelector(`[data-diff="${el.dataset.count}"]`);
      const n = toNum(el.value);
      if(cell){
        if(el.value === '' || n === null){ cell.textContent = ''; cell.className = 'inv-diff'; }
        else { const d = n - Number(it.qty || 0); cell.textContent = d === 0 ? '✓' : (d > 0 ? '+' : '') + fmtN(d); cell.className = 'inv-diff ' + (d > 0 ? 'plus' : d < 0 ? 'minus' : ''); }
      }
    });
    const cn = root.querySelector('#invCNote'); if(cn) cn.oninput = () => { S.countNote = cn.value; };
    const sc = root.querySelector('[data-act=save-count]'); if(sc) sc.onclick = saveCount;

    root.querySelectorAll('[data-del-move]').forEach(b => b.onclick = () => delMove(b.dataset.delMove));
    const si = root.querySelector('[data-act=save-item]'); if(si) si.onclick = saveItem;
    const ce = root.querySelector('[data-act=cancel-edit]'); if(ce) ce.onclick = () => { S.editing = null; S.draft = null; draw(); };
    root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { S.editing = b.dataset.edit; S.draft = null; S.msg = ''; draw(); window.scrollTo({ top:0, behavior:'smooth' }); });
    root.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => toggleItem(b.dataset.toggle));
    const x = root.querySelector('[data-act=xlsx]'); if(x) x.onclick = exportXlsx;
    const lk = root.querySelector('[data-act=low]'); if(lk) lk.onclick = () => {
      S.showLow = !S.showLow; draw();
      if(S.showLow){ const c = document.getElementById('invLow'); if(c) c.scrollIntoView({ behavior:'smooth', block:'start' }); }
    };
    const tg = root.querySelector('#invTarget'); if(tg) tg.onchange = () => {
      const n = toNum(tg.value); if(!n || n <= 0) return;
      S.target = n; S.req = {}; try{ localStorage.setItem('inv_target', n); }catch(e){} draw();
    };
    root.querySelectorAll('[data-req]').forEach(el => el.oninput = () => {
      S.req[el.dataset.req] = el.value;
      const t = document.getElementById('invLowTotal'); if(t) t.textContent = fmtN(lowRows().reduce((a, r) => a + r.need, 0));
    });
    const pr = root.querySelector('[data-act=print-low]'); if(pr) pr.onclick = printShortage;

    // 🧹 تصفير + ⬇️ نسخة كاملة
    const bk = root.querySelector('[data-act=backup]'); if(bk) bk.onclick = async () => {
      S.busy = true; draw();
      try{ const r = await downloadBackup(); S.busy = false; flash(`✅ اتنزّل الشيت: ${fmtN(r.items)} صنف و ${fmtN(r.moves)} حركة.`); }
      catch(e){ S.busy = false; flash('❌ مقدرناش ننزّل الشيت: ' + e.message, true); }
    };
    root.querySelectorAll('[data-rmode]').forEach(b => b.onclick = () => { S.resetMode = b.dataset.rmode; draw(); });
    const rt = root.querySelector('#invResetTxt'); if(rt) rt.oninput = () => {
      S.resetTxt = rt.value;
      const b = document.getElementById('invResetBtn'); if(b) b.disabled = S.busy || rt.value.trim() !== RESET_WORD;
    };
    const rb = root.querySelector('#invResetBtn'); if(rb) rb.onclick = resetInv;

    // 🗓️ ملخص اليوم
    const dpk = root.querySelector('#dayPick'); if(dpk) dpk.onchange = () => { if(!dpk.value) return; S.day = dpk.value; S.dayData = null; loadDay(); };
    root.querySelectorAll('[data-dayq]').forEach(b => b.onclick = () => { S.day = b.dataset.dayq; S.dayData = null; loadDay(); });
    const dg = root.querySelector('[data-act=day-go]'); if(dg) dg.onclick = () => { S.dayData = null; loadDay(); };
    const dw = root.querySelector('[data-act=day-wa]'); if(dw) dw.onclick = sendDay;
    const dn = root.querySelector('#dayNote'); if(dn) dn.oninput = () => { S.dayNote = dn.value; };
    const ts = root.querySelector('[data-act=today-sum]'); if(ts) ts.onclick = () => { S.tab = 'day'; S.msg = ''; S.day = ymd(new Date()); S.dayData = null; loadDay(); };
  }

  async function saveMove(kind){
    const lines = S.lines.map(l => ({ item: l.item, qty: toNum(l.qty), cost: toNum(l.cost) })).filter(l => l.item || l.qty);
    if(!lines.length) return flash('اختار صنف واكتب الكمية.', true);
    for(const l of lines){
      if(!l.item) return flash('فيه سطر من غير صنف.', true);
      if(!l.qty || l.qty <= 0) return flash('الكمية لازم تكون أكبر من صفر في كل سطر.', true);
    }
    if(kind === 'out'){
      const need = {};
      lines.forEach(l => need[l.item] = (need[l.item] || 0) + l.qty);
      for(const id in need){
        const it = itemById(id);
        if(need[id] > Number(it.qty || 0)) return flash(`مينفعش تخرّج ${fmtN(need[id])} من "${it.name}" — المتاح ${fmtN(it.qty)} بس.`, true);
      }
    }
    S.busy = true; draw();
    const buy = kind === 'in' && S.src === 'purchase';
    const rows = lines.map(l => {
      const r = { item_id: Number(l.item), kind, qty: kind === 'out' ? -l.qty : l.qty, note: S.note.trim() || null, created_by_name: myName() };
      if(kind === 'in'){
        r.source = S.src;
        if(buy){ const it = itemById(l.item); r.unit_cost = l.cost ?? (it && it.cost != null ? Number(it.cost) : null); }
      }
      return r;
    });
    const { error } = await sb().from('inv_moves').insert(rows);
    S.busy = false;
    if(error) return flash(/unit_cost|source/i.test(error.message)
      ? '❌ لازم سطرين الـ SQL الجداد يتشغّلوا في Supabase الأول (عمود السعر ونوع الإدخال).'
      : '❌ مقدرناش نسجّل: ' + error.message, true);
    if(buy){ // آخر سعر شراء يبقى سعر تكلفة الصنف
      for(const l of lines) if(l.cost != null) await sb().from('inv_items').update({ cost: l.cost }).eq('id', l.item);
    }
    S.buy = null;
    const n = rows.length;
    S.lines = [{ item:'', qty:'' }]; S.note = '';
    S.msg = `✅ اتسجّل ${kind === 'out' ? 'إخراج' : 'إدخال'} ${n} صنف.`; S.msgErr = false;
    await load();
  }

  async function saveCount(){
    const rows = [];
    for(const id in S.count){
      const v = S.count[id]; if(v === '' || v === undefined) continue;
      const n = toNum(v), it = itemById(id);
      if(n === null || n < 0 || !it) continue;
      const d = n - Number(it.qty || 0);
      if(d !== 0) rows.push({ item_id: Number(id), kind:'adjust', qty: d, note: ('جرد' + (S.countNote.trim() ? ' — ' + S.countNote.trim() : '')), created_by_name: myName() });
    }
    if(!rows.length) return flash('مفيش فروق تتسجّل — كل الأعداد اللي كتبتها زي السيستم (أو ماكتبتش حاجة).', !Object.keys(S.count).length);
    if(!confirm(`هيتعدّل رصيد ${rows.length} صنف حسب العدد الفعلي. تكمل؟`)) return;
    S.busy = true; draw();
    const { error } = await sb().from('inv_moves').insert(rows);
    S.busy = false;
    if(error) return flash('❌ مقدرناش نحفظ الجرد: ' + error.message, true);
    S.count = {}; S.countNote = '';
    S.msg = `✅ اتحفظ الجرد — اتعدّل ${rows.length} صنف.`; S.msgErr = false;
    await load();
  }

  async function saveItem(){
    const g = id => (document.getElementById(id) || {}).value;
    const name = (g('itName') || '').trim();
    if(!name) return flash('اكتب اسم الصنف.', true);
    const data = {
      name, sku: (g('itSku') || '').trim() || null, category: (g('itCat') || '').trim() || null,
      unit: (g('itUnit') || '').trim() || 'قطعة', min_qty: toNum(g('itMin')) || 0, cost: toNum(g('itCost'))
    };
    const open = toNum(g('itOpen'));
    S.draft = { ...data, open: g('itOpen') || '' }; // عشان الفورم مايتمسحش لو حصل خطأ
    S.busy = true; draw();
    if(S.editing){
      const { error } = await sb().from('inv_items').update(data).eq('id', S.editing);
      S.busy = false;
      if(error) return flash('❌ ' + (/duplicate|unique/i.test(error.message) ? 'الكود ده مستخدم لصنف تاني.' : error.message), true);
      S.editing = null; S.draft = null; S.msg = '✅ اتعدّل الصنف.'; S.msgErr = false;
    } else {
      const { data: row, error } = await sb().from('inv_items').insert(data).select().single();
      if(error){ S.busy = false; return flash('❌ ' + (/duplicate|unique/i.test(error.message) ? 'الكود ده مستخدم لصنف تاني.' : error.message), true); }
      if(open && open > 0){
        await sb().from('inv_moves').insert({ item_id: row.id, kind:'in', qty: open, note:'رصيد أول المدة', source:'opening', created_by_name: myName() });
      }
      S.busy = false; S.draft = null; S.msg = `✅ اتضاف "${name}"${open > 0 ? ' برصيد ' + fmtN(open) : ''}.`; S.msgErr = false;
    }
    await load();
  }

  async function toggleItem(id){
    const it = itemById(id); if(!it) return;
    const { error } = await sb().from('inv_items').update({ active: it.active === false }).eq('id', id);
    if(error) return flash('❌ ' + error.message, true);
    S.msg = ''; await load();
  }

  async function delMove(id){
    if(!confirm('تمسح الحركة دي؟ الرصيد هيتحسب من غيرها.')) return;
    const { data, error } = await sb().from('inv_moves').delete().eq('id', id).select('id');
    if(error || !data || !data.length) return flash('❌ مقدرناش نمسح الحركة' + (error ? ': ' + error.message : ' (المسح للأدمن بس).'), true);
    S.msg = '✅ اتمسحت الحركة.'; S.msgErr = false; await load();
  }

  function exportXlsx(){
    const rows = active().map(i => ({ 'الصنف': i.name, 'الكود': i.sku || '', 'التصنيف': i.category || '', 'الكمية': Number(i.qty || 0),
      'الوحدة': i.unit || '', 'الحد الأدنى': Number(i.min_qty || 0), 'التكلفة': i.cost ?? '', 'الحالة': status(i)[0] }));
    const ws = XLSX.utils.json_to_sheet(rows); const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المخزون');
    XLSX.writeFile(wb, 'المخزون ' + new Date().toISOString().slice(0, 10) + '.xlsx');
  }

  // دوسة برا القايمة بتقفلها
  document.addEventListener('click', e => {
    if(ddOpen === null || !isInv()) return;
    if(e.target.closest && e.target.closest('.inv-dd')) return;
    ddOpen = null; ddQ = ''; draw();
  });

  /* ---------- الربط بالراوتر ---------- */
  function mount(){ draw(); if(S.items === null && !S.loading && !S.err) load(); }
  const _render = render;
  render = function(){ _render.apply(this, arguments); if(isInv()) mount(); };
  window.addEventListener('hashchange', () => { if(isInv()) mount(); });
  // بيفتح ملخص يوم معيّن في المخزن من أي قسم تاني (زي قسم الـ EOD)
  window.InvOpenDay = d => {
    S.tab = 'day'; S.msg = ''; S.day = d || ymd(new Date()); S.dayData = null;
    if(isInv()){ if(S.items) loadDay(); else mount(); }
    else { location.hash = '#/dept/warehouse'; if(S.items) setTimeout(loadDay, 50); }
  };
  if(isInv()) setTimeout(mount, 0);
})();
</script>
